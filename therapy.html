悅心診所 心理治療系統 — therapy.html v0.2
版本:v0.2(2026-05-10 v6.0 Step 3-B:[操作] 分頁完整實作 + 跨治療師 OWNER 唯讀)
作者:粟寧醫師(架構主導) × Claude(實作)
設計 anchor:v6_0_therapy_D_design.md (Lock 1-19) + v6_0_therapy_step1_schema.md v4

【v0.1 → v0.2 改動】
- ✅ [操作] 分頁完整實作(替換 placeholder)
  - 上半:4 個 expandable 新增表單(L1 / L1.5 / L2 / L3)
    - L1 / L2 排班內時段下拉 + [使用非排班時段] 切換鈕(對齊 schema v4 line 453)
    - L1.5 病患從現有 L1 active 病患下拉 + 時段從該病患 L1 entries 撈
    - L3 期待時段從排班動態生成 checkbox(只列有排班的格)
  - 下半:4 層資料展示 + 兩階段刪除
    - active → 第一階段按鈕([終止治療]/[恢復]/[取消])→ entry 加刪除線+淡色
    - staged(terminated/restored/canceled)→ [移除] → entry 從畫面消失
- ✅ 跨治療師 OWNER 唯讀模式(粟醫師切到王麟祥 tab)
  - 上半「新增動作區」整區 hide
  - 下半「資料展示」完整顯示
  - 各列操作鈕 disabled + tooltip
- ✅ confirm modal(兩階段刪除前確認,純 OK/取消,不像 admin 那種「打 GO」)
- ✅ 切回 [顯示] 自動 collapse 所有展開表單(對齊 abstinence)
- ✅ 切治療師清 schedule cache(換人排班不一樣)

【設計哲學:世界 2 = 手寫筆記本】
- 最小介入:不替治療師思考、不防呆、不警告
- 衝堂用 1px 灰線連結兩列(L14),不加符號、不變色
- 兩階段刪除([終止]/[取消]/[恢復] → [移除])給反悔空間
- 永遠不做的:衝堂警告、勸阻文案、提示提醒、總人數、自動通知病患

【視覺風格:純白 + 水泥灰 + 工業字型 + 大量留白(C5)】

【入口】
- 直接 URL 訪問 + LIFF 登入(B3 第一階段:URL 路徑)
- 額外密道(B3 第二階段)由後續輪次補

【session】
- 後端 TTL 7200 秒(2 小時)
- 前端 idle 15 分鐘自動登出
- localStorage 持久化(對齊 admin v5.5.15 H12 模式,但 key 不同)

✅ 全部完成,等粟醫師驗收 + 雙 LLM 審查

<style>
/* ══════════════════════════════════════════════════════════════════════════════
   設計 tokens — C5 純白 + 水泥灰 + 工業字型
   ══════════════════════════════════════════════════════════════════════════════ */
:root {
  /* 底色與灰階(純白 + 水泥灰漸層) */
  --paper:      #ffffff;       /* 純白底,主背景 */
  --paper-2:    #fafafa;       /* 微微下沉的二階白 */
  --line:       #e8e8e8;       /* 細分隔線(對齊純白) */
  --line-2:     #d0d0d0;       /* 衝堂用的灰線(L14 1px) */

  --ash:        #b8b8b8;       /* 淡灰 — 第二訊息 */
  --concrete:   #6a6a6a;       /* 中灰 — 標籤 / 元資料 */
  --slate:      #2c2c2c;       /* 深灰 — 主文字(不用純黑,工業色感) */
  --ink:        #1a1a1a;       /* 標題 / 焦點 */

  /* 強調色(極少用,只在 active 狀態 / 焦點輸入框) */
  --steel:      #3d4a5a;       /* 工業鋼藍灰,active tab 用 */

  /* 狀態色(治療師端不警告,只用於登入頁 / 提示) */
  --warn:       #c46b3e;       /* 鏽橘(密碼錯誤) */

  /* 字型 */
  --font-sans:  -apple-system, "SF Pro Text", "Segoe UI", "Helvetica Neue",
                "Noto Sans TC", "Microsoft JhengHei", sans-serif;
  --font-mono:  "JetBrains Mono", "SF Mono", "Consolas", "Courier New", monospace;

  /* 留白尺度(比 admin / booking 大,工業 + abstinence 哲學) */
  --space-xs:   6px;
  --space-sm:   12px;
  --space-md:   20px;
  --space-lg:   36px;
  --space-xl:   60px;

  /* 圓角(極小,工業感不要 round) */
  --r-sm:       2px;
  --r-md:       3px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  background: var(--paper);
  color: var(--slate);
  font-family: var(--font-sans);
  font-size: 15px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  -webkit-text-size-adjust: 100%;
  overflow-x: hidden;
}

body {
  min-height: 100vh;
  padding: 0;
}

/* ══════════════════════════════════════════════════════════════════════════════
   頁面狀態切換
   ══════════════════════════════════════════════════════════════════════════════ */
.page { display: none; }
.page.active { display: block; }

/* ══════════════════════════════════════════════════════════════════════════════
   pageAuth — LIFF init / 權限不足 / 連線錯誤
   ══════════════════════════════════════════════════════════════════════════════ */
#pageAuth {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: var(--space-lg);
}
#pageAuth.active { display: flex; }

.auth-box {
  text-align: center;
  max-width: 420px;
}

.auth-mark {
  width: 56px;
  height: 56px;
  margin: 0 auto var(--space-md);
  border: 1px solid var(--line-2);
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-mono);
  font-size: 24px;
  letter-spacing: 2px;
  color: var(--concrete);
}

.auth-title {
  font-size: 18px;
  font-weight: 500;
  letter-spacing: 0.5px;
  color: var(--ink);
  margin-bottom: var(--space-xs);
}

.auth-sub {
  font-size: 14px;
  color: var(--concrete);
  line-height: 1.7;
}

.auth-btn {
  margin-top: var(--space-md);
  padding: 10px 28px;
  background: var(--paper);
  color: var(--slate);
  border: 1px solid var(--line-2);
  font-family: inherit;
  font-size: 14px;
  letter-spacing: 1px;
  cursor: pointer;
  transition: border-color 0.15s;
}
.auth-btn:hover { border-color: var(--slate); }

/* ══════════════════════════════════════════════════════════════════════════════
   pageLogin — 密碼輸入
   ══════════════════════════════════════════════════════════════════════════════ */
#pageLogin {
  min-height: 100vh;
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: var(--space-lg);
}
#pageLogin.active { display: flex; }

.login-box {
  width: 100%;
  max-width: 360px;
}

.login-title {
  font-size: 22px;
  font-weight: 400;
  letter-spacing: 1px;
  color: var(--ink);
  margin-bottom: var(--space-xs);
  text-align: center;
}

.login-sub {
  font-size: 13px;
  color: var(--concrete);
  text-align: center;
  margin-bottom: var(--space-lg);
  letter-spacing: 0.5px;
}

.login-input {
  width: 100%;
  padding: 14px var(--space-sm);
  background: var(--paper);
  color: var(--slate);
  border: 1px solid var(--line-2);
  border-radius: 0;
  font-family: var(--font-sans);
  font-size: 16px;
  letter-spacing: 2px;
  text-align: center;
  outline: none;
  transition: border-color 0.15s;
}
.login-input:focus { border-color: var(--steel); }

.login-btn {
  width: 100%;
  margin-top: var(--space-md);
  padding: 14px;
  background: var(--slate);
  color: var(--paper);
  border: none;
  border-radius: 0;
  font-family: inherit;
  font-size: 14px;
  font-weight: 500;
  letter-spacing: 4px;
  cursor: pointer;
  transition: background 0.15s;
}
.login-btn:disabled {
  background: var(--ash);
  cursor: not-allowed;
}
.login-btn:not(:disabled):hover { background: var(--ink); }

.login-error {
  display: none;
  margin-top: var(--space-sm);
  padding: var(--space-sm);
  background: var(--paper-2);
  border-left: 2px solid var(--warn);
  font-size: 13px;
  color: var(--warn);
  letter-spacing: 0.5px;
}
.login-info {
  display: none;
  margin-top: var(--space-sm);
  font-size: 12px;
  color: var(--ash);
  text-align: center;
  letter-spacing: 0.5px;
}

/* ══════════════════════════════════════════════════════════════════════════════
   pageMain — 主頁
   ══════════════════════════════════════════════════════════════════════════════ */
#pageMain {
  display: none;
  min-height: 100vh;
  background: var(--paper);
}
#pageMain.active { display: block; }

/* Header — 上方治療師分頁列 + 元資料 */
.header {
  background: var(--paper);
  border-bottom: 1px solid var(--line);
  padding: var(--space-md) var(--space-lg) 0;
}

.meta-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 12px;
  color: var(--ash);
  letter-spacing: 1px;
  text-transform: uppercase;
  margin-bottom: var(--space-md);
}

.meta-row .brand {
  font-family: var(--font-mono);
  font-weight: 500;
  color: var(--concrete);
}

.meta-row .me {
  display: flex;
  gap: var(--space-md);
  align-items: center;
}

.btn-logout {
  background: transparent;
  border: none;
  color: var(--ash);
  font-family: inherit;
  font-size: 12px;
  letter-spacing: 1px;
  cursor: pointer;
  padding: 4px 8px;
}
.btn-logout:hover { color: var(--slate); }

/* 治療師分頁列(L1 OWNER 跨治療師檢視) */
.therapist-tabs {
  display: flex;
  gap: 0;
  padding-bottom: 0;
}

.therapist-tab {
  background: transparent;
  border: none;
  border-bottom: 2px solid transparent;
  color: var(--concrete);
  font-family: inherit;
  font-size: 15px;
  font-weight: 400;
  letter-spacing: 1px;
  padding: 10px var(--space-md) 12px;
  cursor: pointer;
  transition: color 0.15s, border-color 0.15s;
}
.therapist-tab.active {
  color: var(--ink);
  border-bottom-color: var(--steel);
  font-weight: 500;
}
.therapist-tab:hover:not(.active) {
  color: var(--slate);
}

/* readonly 提示條 */
.readonly-banner {
  display: none;
  padding: var(--space-sm) var(--space-lg);
  background: var(--paper-2);
  border-bottom: 1px solid var(--line);
  font-size: 12px;
  color: var(--concrete);
  letter-spacing: 1px;
}
.readonly-banner.visible { display: block; }

/* sub-tab [顯示] / [操作] */
.subtabs {
  display: flex;
  gap: var(--space-md);
  padding: 0 var(--space-lg);
  background: var(--paper);
  border-bottom: 1px solid var(--line);
  /* v0.5:scroll 時 subtabs 黏在頂端,讓「切顯示/操作」永遠可達 */
  position: sticky;
  top: 0;
  z-index: 50;
  /* 微陰影,scroll 過頭部時透露「下方有內容」的層次 */
  box-shadow: 0 0 0 rgba(0, 0, 0, 0);
  transition: box-shadow 0.2s;
}
.subtabs.is-stuck {
  box-shadow: 0 4px 8px rgba(0, 0, 0, 0.04);
}

.subtab {
  background: transparent;
  border: none;
  color: var(--ash);
  font-family: inherit;
  font-size: 13px;
  font-weight: 500;
  letter-spacing: 2px;
  padding: var(--space-sm) 0;
  cursor: pointer;
  border-bottom: 1px solid transparent;
  margin-bottom: -1px; /* 蓋住 .subtabs 底邊線 */
  transition: color 0.15s, border-color 0.15s;
}
.subtab.active {
  color: var(--ink);
  border-bottom-color: var(--ink);
}

/* 主要內容區 */
.content {
  padding: var(--space-lg);
  max-width: 1100px;
  margin: 0 auto;
}

/* ══════════════════════════════════════════════════════════════════════════════
   [顯示] 分頁:三區塊 — 今天 / 本週 / 候補
   ══════════════════════════════════════════════════════════════════════════════ */

/* v0.5:section v2 設計 — 編號浮左 + 細體大標 + 短橫包數字
   - .section 加 grid 讓 .section-num 浮在左側 36px 欄
   - .section-collapsible(新增)不套編號,維持原樣
*/
.section {
  margin-bottom: 56px; /* v0.5:從 40 拉到 56 — 對齊 v2 mock 留白節奏 */
  display: grid;
  grid-template-columns: 36px 1fr;
  gap: 4px;
}
.section:last-child { margin-bottom: 0; }

/* 浮左編號(mono 細字,像筆記本邊緣的頁碼) */
.section-num {
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--ash);
  letter-spacing: 1px;
  padding-top: 7px; /* 跟下方 section-title baseline 對齊 */
  font-weight: 400;
}

.section-body { min-width: 0; }

.section-head {
  display: flex;
  align-items: baseline;
  gap: var(--space-md);
  margin-bottom: 22px; /* v0.5:14→22,對齊 v2 留白 */
  padding-bottom: 14px;
  border-bottom: 1px solid var(--line);
}

.section-title {
  font-size: 17px;       /* v0.5:14→17,B 視覺層級 */
  font-weight: 300;      /* v0.5:500→300 細體 */
  letter-spacing: 4px;   /* v0.5:3→4 拉開字距 */
  color: var(--ink);
  /* v0.5:拿掉 text-transform uppercase(中文沒影響,但若未來混英文,uppercase 反而打斷 */
}

.section-meta {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--ash);
  letter-spacing: 2px;
}
/* v0.5:meta 用 — 包數字(對齊 v2「— 4 —」設計) */
.section-meta::before, .section-meta::after {
  content: "—";
  margin: 0 6px;
  color: var(--line-2);
}
/* v0.5:今天/本週的 meta 是日期範圍而非計數,例外不要 — 包夾 */
.section-meta.no-dashes::before,
.section-meta.no-dashes::after {
  content: none;
}

/* v0.3:可收合 section(目前只用在「新增」)
   v0.5:新增 section 不用 v2 編號 grid,要把 grid 取消 */
.section-collapsible {
  display: block; /* 取消父層 grid,讓「新增」維持原樣 */
}
.section-collapsible .section-head {
  /* 新增 section 不要 v2 留白,維持收折感 */
  margin-bottom: 0;
}
.section-collapsible .section-head-clickable {
  cursor: pointer;
  user-select: none;
  justify-content: space-between;
  margin-bottom: 0;
  padding-bottom: var(--space-sm);
  transition: background 0.12s;
}
.section-collapsible .section-head-clickable:hover {
  background: var(--paper-2);
}
/* 新增 section 的 title 維持原本字級風格(不套 v2 細體) */
.section-collapsible .section-title {
  font-size: 14px;
  font-weight: 500;
  letter-spacing: 3px;
}
/* 新增 section 不要 — meta 包夾 */
.section-collapsible .section-meta::before,
.section-collapsible .section-meta::after {
  content: none;
}
.section-collapsible .section-toggle-icon {
  font-family: var(--font-mono);
  font-size: 18px;
  color: var(--ash);
  transition: transform 0.2s;
  font-weight: 300;
}
.section-collapsible.section-expanded .section-toggle-icon {
  color: var(--concrete);
}
.section-collapsible .section-body {
  display: none;
  padding-top: var(--space-md);
  padding-bottom: var(--space-lg);
}
.section-collapsible.section-expanded .section-body {
  display: block;
}
/* v0.3:整個 addSectionWrap 跟下方資料區塊的分隔
   v0.5:配合 section margin 從 40 → 56,addSectionWrap 也跟著拉 */
#addSectionWrap {
  border-bottom: 2px solid var(--line);
  margin-bottom: 56px;
  padding-bottom: var(--space-md);
}
/* 唯讀模式下 #addSectionWrap 整區 hide,連同分隔線一起消失 */
.readonly-view #addSectionWrap { display: none; }

/* 今天 case 列表 */
.case-list {
  display: flex;
  flex-direction: column;
  gap: 0; /* 用 row separator,不用 gap 拉開 */
}

.case-row {
  display: grid;
  grid-template-columns: 110px 1fr auto;
  align-items: baseline;
  gap: var(--space-md);
  padding: var(--space-md) 0;
  border-top: 1px solid var(--line);
  position: relative;
}
.case-list .case-row:first-child { border-top: none; }

/* 衝堂 1px 灰線連結兩列(L14)— 只在今天區塊 */
.case-row.conflict-with-next::after {
  content: "";
  position: absolute;
  left: 0;
  right: 0;
  bottom: -1px; /* 蓋在下一列的 border-top 上方 */
  height: 1px;
  background: var(--line-2);
  z-index: 1;
}

.case-time {
  font-family: var(--font-mono);
  font-size: 16px;
  letter-spacing: 1px;
  color: var(--ink);
  white-space: nowrap;
}

.case-name {
  font-size: 16px;
  color: var(--slate);
  font-weight: 400;
}

.case-tag {
  font-size: 11px;
  letter-spacing: 1.5px;
  color: var(--ash);
  text-transform: uppercase;
  white-space: nowrap;
  border: 1px solid var(--line);
  padding: 2px 8px;
}
.case-tag.tag-l2 { color: var(--concrete); border-color: var(--line-2); }

.case-room {
  display: inline-block;
  margin-left: var(--space-xs);
  font-size: 12px;
  color: var(--ash);
  letter-spacing: 0.5px;
}

.empty-hint {
  padding: var(--space-md) 0;
  font-family: var(--font-mono); /* v0.5:加 mono,工業風 */
  font-size: 11px;
  color: var(--ash);
  letter-spacing: 2px;
  text-align: center; /* v0.5:置中 */
}

/* 本週月曆 — Responsive(桌機 6 欄並列、手機直式堆疊) */
.week-grid {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: 1px;
  background: var(--line);
  border: 1px solid var(--line);
}

.week-day {
  background: var(--paper);
  padding: var(--space-sm);
  min-height: 140px;
}

.week-day.is-today {
  background: var(--paper-2);
}

.week-day-head {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  margin-bottom: var(--space-sm);
  padding-bottom: 6px;
  border-bottom: 1px solid var(--line);
}

.week-day-name {
  font-size: 11px;
  color: var(--concrete);
  letter-spacing: 2px;
  text-transform: uppercase;
}

.week-day-date {
  font-family: var(--font-mono);
  font-size: 12px;
  color: var(--ash);
}

.week-day.is-today .week-day-date { color: var(--steel); font-weight: 500; }

.week-case {
  font-size: 14px;
  color: var(--slate);
  margin-bottom: 4px;
  line-height: 1.4;
}
.week-case .week-time {
  font-family: var(--font-mono);
  font-size: 12px;
  color: var(--ash);
  margin-right: 4px;
}

@media (max-width: 720px) {
  /* 手機:本週改直式堆疊 */
  .week-grid {
    grid-template-columns: 1fr;
    border: none;
    background: transparent;
    gap: var(--space-sm);
  }
  .week-day {
    border: 1px solid var(--line);
    min-height: auto;
  }
  .content { padding: var(--space-md); }
  .header { padding: var(--space-md) var(--space-md) 0; }
  .subtabs { padding: 0 var(--space-md); }
  .case-row { grid-template-columns: 80px 1fr auto; gap: var(--space-sm); }
  .case-time { font-size: 14px; }
  .case-name { font-size: 14px; }
}

/* 候補摘要 */
.waitlist-summary {
  display: flex;
  flex-direction: column;
  gap: var(--space-sm);
}
.waitlist-row {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  padding: var(--space-sm) 0;
  border-top: 1px solid var(--line);
  cursor: pointer;
}
.waitlist-row:first-child { border-top: none; }
.waitlist-row:hover .waitlist-name { color: var(--ink); }

.waitlist-name {
  font-size: 14px;
  color: var(--slate);
  transition: color 0.15s;
}

.waitlist-meta {
  font-family: var(--font-mono);
  font-size: 12px;
  color: var(--ash);
  letter-spacing: 1px;
}

/* ══════════════════════════════════════════════════════════════════════════════
   modal — 候補列表詳情
   ══════════════════════════════════════════════════════════════════════════════ */
.modal-overlay {
  display: none;
  position: fixed;
  top: 0; left: 0;
  width: 100vw; height: 100vh;
  background: rgba(20, 20, 20, 0.5);
  z-index: 100;
  padding: var(--space-lg);
  align-items: center;
  justify-content: center;
}
.modal-overlay.visible { display: flex; }

.modal-box {
  background: var(--paper);
  border: 1px solid var(--line-2);
  max-width: 480px;
  width: 100%;
  max-height: 80vh;
  overflow-y: auto;
}
.modal-head {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  padding: var(--space-md) var(--space-lg);
  border-bottom: 1px solid var(--line);
}
.modal-title {
  font-size: 14px;
  font-weight: 500;
  letter-spacing: 3px;
  color: var(--ink);
  text-transform: uppercase;
}
.modal-close {
  background: transparent;
  border: none;
  color: var(--ash);
  font-size: 18px;
  cursor: pointer;
  padding: 0 4px;
  line-height: 1;
}
.modal-close:hover { color: var(--slate); }
.modal-body {
  padding: var(--space-md) var(--space-lg);
}

/* ══════════════════════════════════════════════════════════════════════════════
   [操作] 分頁 placeholder
   ══════════════════════════════════════════════════════════════════════════════ */
.placeholder-box {
  padding: var(--space-xl) var(--space-md);
  text-align: center;
  background: var(--paper-2);
  border: 1px dashed var(--line-2);
}
.placeholder-title {
  font-size: 14px;
  letter-spacing: 2px;
  color: var(--concrete);
  margin-bottom: var(--space-sm);
}
.placeholder-sub {
  font-size: 12px;
  color: var(--ash);
  letter-spacing: 1px;
}

/* ══════════════════════════════════════════════════════════════════════════════
   [操作] 分頁:expandable 新增區塊 + 表單 + 資料項目 + 兩階段刪除
   ══════════════════════════════════════════════════════════════════════════════ */

/* expandable 新增區塊 */
.add-block {
  border-bottom: 1px solid var(--line);
  /* v0.3:limit width 跟下方 entry-row 對齊,按鈕不要靠最右 */
  max-width: 880px;
}
.add-block:last-child { border-bottom: none; }
.add-block-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: var(--space-md) 0;
  cursor: pointer;
  user-select: none;
}
.add-block-head:hover .add-block-title { color: var(--ink); }

.add-block-title {
  font-size: 14px;
  font-weight: 500;
  letter-spacing: 2px;
  color: var(--slate);
  transition: color 0.15s;
}
.add-block-icon {
  font-family: var(--font-mono);
  font-size: 14px;
  color: var(--ash);
  transition: transform 0.2s;
}
.add-block.expanded .add-block-icon {
  transform: rotate(45deg);
}

.add-block-form {
  display: none;
  padding: 0 0 var(--space-lg);
}
.add-block.expanded .add-block-form { display: block; }

/* 表單 grid */
.form-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: var(--space-md);
  margin-bottom: var(--space-md);
}
.form-grid.full { grid-template-columns: 1fr; }
.form-field { display: flex; flex-direction: column; }
.form-field.span-2 { grid-column: 1 / -1; }

.form-label {
  font-size: 11px;
  letter-spacing: 1.5px;
  color: var(--concrete);
  text-transform: uppercase;
  margin-bottom: 6px;
}
.form-input,
.form-select {
  padding: 10px 12px;
  background: var(--paper);
  color: var(--slate);
  border: 1px solid var(--line-2);
  border-radius: 0;
  font-family: inherit;
  font-size: 14px;
  outline: none;
  transition: border-color 0.15s;
  -webkit-appearance: none;
  appearance: none;
}
.form-input:focus,
.form-select:focus { border-color: var(--steel); }
.form-input[type="number"] { font-family: var(--font-mono); }
.form-input[type="time"],
.form-input[type="date"] { font-family: var(--font-mono); }

.form-select {
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'><path d='M0 0l5 6 5-6z' fill='%236a6a6a'/></svg>");
  background-repeat: no-repeat;
  background-position: right 12px center;
  padding-right: 32px;
}

/* checkbox group(layer3 期待時段用) */
.checkbox-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 6px;
}
.checkbox-item {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  color: var(--slate);
  cursor: pointer;
  padding: 6px 8px;
  border: 1px solid var(--line);
  letter-spacing: 0.5px;
  user-select: none;
  transition: border-color 0.15s, background 0.15s;
}
.checkbox-item:hover { border-color: var(--line-2); }
.checkbox-item.checked {
  border-color: var(--steel);
  background: var(--paper-2);
}
.checkbox-item input { margin: 0; cursor: pointer; }

/* 切換鈕(自由輸入時段) */
.field-toggle {
  margin-top: 6px;
  font-size: 11px;
  color: var(--ash);
  letter-spacing: 0.5px;
  cursor: pointer;
  user-select: none;
}
.field-toggle:hover { color: var(--concrete); }

/* 表單錯誤訊息 */
.form-error {
  display: none;
  padding: var(--space-sm);
  background: var(--paper-2);
  border-left: 2px solid var(--warn);
  font-size: 12px;
  color: var(--warn);
  letter-spacing: 0.5px;
  margin-bottom: var(--space-md);
}

/* 表單動作列 */
.form-actions {
  display: flex;
  gap: var(--space-sm);
  justify-content: flex-end;
}
.btn-primary,
.btn-secondary {
  padding: 10px 24px;
  font-family: inherit;
  font-size: 13px;
  letter-spacing: 2px;
  cursor: pointer;
  border-radius: 0;
  transition: all 0.15s;
}
.btn-primary {
  background: var(--slate);
  color: var(--paper);
  border: 1px solid var(--slate);
}
.btn-primary:disabled {
  background: var(--ash);
  border-color: var(--ash);
  cursor: not-allowed;
}
.btn-primary:not(:disabled):hover { background: var(--ink); border-color: var(--ink); }
.btn-secondary {
  background: var(--paper);
  color: var(--concrete);
  border: 1px solid var(--line-2);
}
.btn-secondary:hover { color: var(--slate); border-color: var(--slate); }

/* 4 層資料展示:每筆 entry
   v0.5:配合 v2 設計,留白拉大 + 字距加深 + entry-meta-dim 給「大室」用 */
.entry-list {
  display: flex;
  flex-direction: column;
}
.entry-row {
  display: grid;
  grid-template-columns: 1fr auto;
  grid-template-rows: auto auto;
  column-gap: var(--space-md);
  row-gap: 6px; /* v0.5:4→6,稍微多呼吸 */
  padding: 18px 0; /* v0.5:--space-md(20)→18,搭配 v2 mock */
  border-top: 1px solid var(--line);
  max-width: 880px;
}
.entry-list .entry-row:first-child { border-top: none; }

.entry-row.is-staged {
  opacity: 0.45;
}
.entry-row.is-staged .entry-info {
  text-decoration: line-through;
  text-decoration-color: var(--ash);
}

.entry-info {
  grid-column: 1 / 2;
  grid-row: 1 / 3;
  display: flex;
  flex-direction: column;
  gap: 6px; /* v0.5:4→6 */
  min-width: 0;
}
.entry-line-1 {
  display: flex;
  align-items: baseline;
  gap: 14px; /* v0.5:--space-sm(12)→14 */
  flex-wrap: wrap;
  font-size: 14px;
  color: var(--slate);
}
.entry-line-1 .entry-name-wrap {
  font-size: 14px;       /* v0.5:15→14 對齊 v2 */
  color: var(--ink);
  font-weight: 500;
  letter-spacing: 1px;   /* v0.5:加 letter-spacing,姓名更有「呼吸」 */
  margin-right: var(--space-xs);
}
.entry-line-1 .entry-meta {
  font-family: var(--font-mono);
  font-size: 11px;       /* v0.5:12→11 對齊 v2 */
  color: var(--concrete);
  letter-spacing: 0.5px;
}
/* v0.5:entry-meta-dim — 給「大室」這種次要資訊,顏色更淡 */
.entry-line-1 .entry-meta-dim {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--ash);
  letter-spacing: 0.5px;
}
.entry-line-2 {
  font-family: var(--font-mono); /* v0.5:加 mono(原本沒指定)*/
  font-size: 10px;        /* v0.5:12→10 對齊 v2 */
  color: var(--ash);      /* v0.5:concrete→ash 拉淡 */
  letter-spacing: 1px;
}
/* v0.5:entry-line-2 內的 · 點分隔器,顏色比文字再淡 */
.entry-line-2 .dot {
  margin: 0 8px;
  color: var(--line-2);
}

.entry-actions {
  grid-column: 2 / 3;
  grid-row: 1 / 2;
  align-self: start;
  display: flex;
  gap: 6px;
  flex-shrink: 0;
}
.btn-action {
  padding: 8px 14px;       /* v0.5:6/12→8/14 加大可點擊區域 */
  font-family: var(--font-mono); /* v0.5:inherit→mono 工業質地 */
  font-size: 10px;          /* v0.5:11→10 對齊 v2 */
  letter-spacing: 2px;      /* v0.5:1.5→2 拉開 */
  background: transparent;  /* v0.5:paper→transparent 更輕 */
  color: var(--concrete);
  border: 1px solid var(--line);
  cursor: pointer;
  transition: all 0.15s;
  white-space: nowrap;
  text-transform: uppercase; /* v0.5:對中文無效但對英文「remove」有效 */
}
.btn-action:hover:not(:disabled) {
  color: var(--ink);
  border-color: var(--ink);
  background: var(--paper-2); /* v0.5:hover 微底色 */
}
.btn-action.btn-action-stage2 {
  color: var(--slate);
  border-color: var(--slate);
}
.btn-action.btn-action-stage2:hover:not(:disabled) {
  background: var(--slate);
  color: var(--paper);
}
.btn-action:disabled {
  cursor: not-allowed;
  opacity: 0.4;
  color: var(--ash);
}

/* 唯讀檢視:整區 hide(上半新增區)— 規則已寫在上方 .section-collapsible 區段 */

/* 唯讀提示(下半 entries 上方) */
.readonly-hint {
  display: none;
  padding: var(--space-sm) var(--space-md);
  margin-bottom: var(--space-md);
  background: var(--paper-2);
  border-left: 2px solid var(--ash);
  font-size: 11px;
  color: var(--concrete);
  letter-spacing: 1px;
}
.readonly-view .readonly-hint { display: block; }

/* confirm modal */
.confirm-msg {
  font-size: 14px;
  color: var(--slate);
  line-height: 1.7;
  margin-bottom: var(--space-md);
}
.confirm-msg strong {
  color: var(--ink);
  font-weight: 500;
}
.confirm-actions {
  display: flex;
  gap: var(--space-sm);
  justify-content: flex-end;
}

/* loading overlay 局部覆蓋(送單中) */
.local-loading {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--ash);
  letter-spacing: 1px;
}

/* 手機版:form grid 改單欄、entry 兩行式對齊 */
@media (max-width: 720px) {
  .form-grid { grid-template-columns: 1fr; }

  /* v0.3:手機版 entry 維持 grid 兩欄(姓名+按鈕同列),元資料在第二行 */
  .entry-row {
    grid-template-columns: 1fr auto;
    column-gap: var(--space-sm);
    padding: var(--space-md) 0;
  }
  /* 手機版 line-1 元資料字體 / 行高再小一點,避免擠 */
  .entry-line-1 {
    gap: 6px;
    font-size: 13px;
  }
  .entry-line-1 .entry-name-wrap { font-size: 14px; }
  .entry-line-1 .entry-meta { font-size: 11px; }
  .entry-line-2 { font-size: 11px; }
}

/* ══════════════════════════════════════════════════════════════════════════════
   loading dots(極簡工業風)
   ══════════════════════════════════════════════════════════════════════════════ */
.loading-dots {
  display: inline-flex;
  gap: 4px;
}
.loading-dots span {
  width: 4px;
  height: 4px;
  background: var(--ash);
  animation: dot-pulse 1.4s infinite ease-in-out;
}
.loading-dots span:nth-child(2) { animation-delay: 0.2s; }
.loading-dots span:nth-child(3) { animation-delay: 0.4s; }
@keyframes dot-pulse {
  0%, 80%, 100% { opacity: 0.2; }
  40% { opacity: 1; }
}

/* ══════════════════════════════════════════════════════════════════════════════
   v6.0 Step 4-A · therapy loading 系統(方案 C 混合)
   - submit:form 淡化 + 按鈕內三點(輕量,1-2s 場景,不打斷節奏)
   - load:容器套 local overlay + 中央三點 + mono 副標(2-5s 場景,清楚轉場)
   ══════════════════════════════════════════════════════════════════════════════ */

/* form 進入 busy 狀態:整體淡化 + 阻擋 pointer */
.form-busy {
  opacity: 0.4;
  pointer-events: none;
  transition: opacity 0.15s ease;
}
/* 但 submit 按鈕保持實體不淡化(語意:「form frozen,但按鈕正在動」) */
.form-busy .btn-primary,
.form-busy .btn-busy-keep {
  opacity: 1 !important;
}

/* 按鈕內三點(submit 中):取代按鈕文字 */
.btn-dots {
  display: inline-flex;
  gap: 4px;
  align-items: center;
  justify-content: center;
}
.btn-dots span {
  width: 4px;
  height: 4px;
  background: #ffffff; /* 黑底按鈕配白點 */
  animation: dot-pulse 1.4s infinite ease-in-out;
}
.btn-dots span:nth-child(2) { animation-delay: 0.2s; }
.btn-dots span:nth-child(3) { animation-delay: 0.4s; }

/* local overlay:覆蓋於 load 區塊上方,白色半透明 + 中央 dots + mono 副標 */
.local-overlay {
  position: absolute;
  inset: 0;
  background: rgba(255, 255, 255, 0.92);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 12px;
  z-index: 5;
  pointer-events: auto; /* 阻擋下層互動 */
  animation: localOverlayFadeIn 0.18s ease-out;
}
@keyframes localOverlayFadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}
.local-overlay-dots {
  display: inline-flex;
  gap: 5px;
}
.local-overlay-dots span {
  width: 5px;
  height: 5px;
  background: var(--steel);
  animation: dot-pulse 1.4s infinite ease-in-out;
}
.local-overlay-dots span:nth-child(2) { animation-delay: 0.2s; }
.local-overlay-dots span:nth-child(3) { animation-delay: 0.4s; }
.local-overlay-text {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--concrete);
  letter-spacing: 3px;
}
.local-overlay-sub {
  font-family: var(--font-mono);
  font-size: 9px;
  color: var(--ash);
  letter-spacing: 2px;
}

/* 容器需 position:relative 才能讓 local-overlay absolute inset 正確定位 */
.has-local-overlay {
  position: relative;
}

/* v0.5:section stagger fade-in(進分頁時 sections 由上往下漸入) */
@keyframes sectionFadeIn {
  from { opacity: 0; transform: translateY(6px); }
  to   { opacity: 1; transform: translateY(0); }
}
#paneDisplay > .section,
#paneOperation > .section {
  animation: sectionFadeIn 0.4s ease-out backwards;
}
#paneDisplay > .section:nth-child(1),
#paneOperation > .section:nth-child(1) { animation-delay: 0.00s; }
#paneDisplay > .section:nth-child(2),
#paneOperation > .section:nth-child(2) { animation-delay: 0.05s; }
#paneDisplay > .section:nth-child(3),
#paneOperation > .section:nth-child(3) { animation-delay: 0.10s; }
#paneDisplay > .section:nth-child(4),
#paneOperation > .section:nth-child(4) { animation-delay: 0.15s; }
#paneDisplay > .section:nth-child(5),
#paneOperation > .section:nth-child(5) { animation-delay: 0.20s; }
/* readonly-hint 跟 addSectionWrap 也要漸入,但延遲在最前 */
#paneOperation > .readonly-hint,
#paneOperation > #addSectionWrap {
  animation: sectionFadeIn 0.4s ease-out backwards;
}

/* ══════════════════════════════════════════════════════════════════════════════
   v0.4-loading-c r2 · 移除動畫(對齊 demo)
   - entry 淡出 + 高度收合(500ms,40% fade + 60% collapse)
   - modal fade in/out(200ms)
   - toast(下方滑入,1.8s 自動消失)
   ══════════════════════════════════════════════════════════════════════════════ */

/* entry 從清單移除時的動畫 */
.entry-removing {
  animation: entryFadeCollapse 0.5s ease-out forwards;
  pointer-events: none;
  overflow: hidden;
}
@keyframes entryFadeCollapse {
  0%   { opacity: 1; }
  40%  { opacity: 0; max-height: 200px; padding-top: var(--space-md); padding-bottom: var(--space-md); }
  100% { opacity: 0; max-height: 0; padding-top: 0; padding-bottom: 0;
         border-bottom-width: 0; margin: 0; }
}

/* modal fade in/out(改造既有 .modal-overlay,維持向下相容) */
.modal-overlay {
  opacity: 0;
  transition: opacity 0.2s ease;
}
.modal-overlay.visible { opacity: 1; }
.modal-overlay.closing { opacity: 0; }

/* modal 內容輕微位移(增強 fade-in 動感) */
.modal-overlay .modal-box {
  transform: translateY(8px);
  transition: transform 0.2s ease;
}
.modal-overlay.visible .modal-box { transform: translateY(0); }
.modal-overlay.closing .modal-box { transform: translateY(8px); }

/* modal busy 狀態:整體淡化但確認按鈕保持實體(對齊方案 C) */
.modal-overlay.busy .modal-box {
  opacity: 0.4;
  pointer-events: none;
  transition: opacity 0.2s;
}
.modal-overlay.busy .btn-primary {
  opacity: 1 !important;
  pointer-events: auto;
}

/* toast 工業風(下方滑入,中英並列 mono) */
.toast {
  position: fixed;
  bottom: 32px;
  left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: var(--ink);
  color: var(--paper);
  padding: 10px 24px;
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 3px;
  z-index: 200;
  opacity: 0;
  transition: opacity 0.25s ease, transform 0.25s ease;
  pointer-events: none;
}
.toast.visible {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}
</style>
</head>
<body>

<!-- ════════════════════════════════════════════════════════════════════════════
     pageAuth — LIFF init / 權限不足 / 錯誤
     ════════════════════════════════════════════════════════════════════════════ -->
<div id="pageAuth" class="page active">
  <div class="auth-box">
    <div class="auth-mark" id="authMark">YX</div>
    <div class="auth-title" id="authTitle">驗證中</div>
    <div class="auth-sub" id="authSub"><span class="loading-dots"><span></span><span></span><span></span></span></div>
    <div id="authActions" style="display:none;">
      <button class="auth-btn" onclick="location.reload()">重新載入</button>
    </div>
  </div>
</div>

<!-- ════════════════════════════════════════════════════════════════════════════
     pageLogin — 密碼輸入
     ════════════════════════════════════════════════════════════════════════════ -->
<div id="pageLogin" class="page">
  <div class="login-box">
    <div class="login-title">心理治療系統</div>

<div class="toast" id="therapyToast"></div>

<script>
/* ══════════════════════════════════════════════════════════════════════════════
   設定
   ══════════════════════════════════════════════════════════════════════════════ */

// LIFF ID(2026-05-10 申請)
// LINE Developers Channel: 2009340533(跟 admin / booking 同 channel)
// Endpoint URL: https://yuexin913.github.io/yuexin-queue/therapy.html
// 完整 LIFF URL(可給治療師存書籤): https://liff.line.me/2009340533-DTb5StXq
const LIFF_ID = "2009340533-DTb5StXq";

// API URL(對齊 admin.html line 2912 的 API_URL,治療師端跟 admin 同一個 GAS endpoint)
const API_URL = "https://script.google.com/macros/s/AKfycbxfbtWB6tyWUvFY1r_d26yxdm3Iz6zVALuZgUwLYyqIOHkJrn7TJJADkUE8VPkKOkZkqw/exec";

const XHR_TIMEOUT = 30000; // 30 秒(對齊 admin)
const IDLE_TIMEOUT_MS = 15 * 60 * 1000; // A3:閒置 15 分鐘自動登出
const SESSION_STORAGE_KEY = "yuexinTherapySession_v1";

/* ══════════════════════════════════════════════════════════════════════════════
   狀態
   ══════════════════════════════════════════════════════════════════════════════ */
const state = {
  lineId: "",
  sessionToken: "",
  myName: "",          // 自己中文名(粟寧 / 王麟祥)
  isOwner: false,      // OWNER = 粟醫師
  visibleTherapists: [], // 我能看的治療師清單
  selectedTherapist: "", // 目前選中的治療師(預設自己)
  loginTime: "",
  rawEntries: null,    // getTherapistRawEntries 的快取(切分頁時重新拿)
  subtab: "display",   // 'display' | 'operation'
  idleTimerId: null
};

/* ══════════════════════════════════════════════════════════════════════════════
   localStorage session 持久化(對齊 admin v5.5.15 H12 pattern,但 key 不同)
   ══════════════════════════════════════════════════════════════════════════════ */
function saveSessionToStorage() {
  try {
    localStorage.setItem(SESSION_STORAGE_KEY, JSON.stringify({
      lineId: state.lineId,
      sessionToken: state.sessionToken,
      myName: state.myName,
      isOwner: state.isOwner,
      loginTime: state.loginTime,
      savedAt: Date.now()
    }));
  } catch (e) { /* 失敗不影響流程 */ }
}

function loadSessionFromStorage() {
  try {
    const raw = localStorage.getItem(SESSION_STORAGE_KEY);
    if (!raw) return null;
    const saved = JSON.parse(raw);
    if (!saved.lineId || !saved.sessionToken || !saved.myName) return null;
    // 本地 2 小時 TTL(對齊 backend tsess_ TTL 7200 秒)
    if (saved.savedAt && (Date.now() - saved.savedAt) > 2 * 60 * 60 * 1000) {
      clearSessionFromStorage();
      return null;
    }
    return saved;
  } catch (e) { return null; }
}

function clearSessionFromStorage() {
  try { localStorage.removeItem(SESSION_STORAGE_KEY); } catch (e) {}
}

/* ══════════════════════════════════════════════════════════════════════════════
   xhr helpers(對齊 admin xhrPost / xhrGet pattern,自動帶 token + 處理 session_expired)
   ══════════════════════════════════════════════════════════════════════════════ */
function xhrParseResponse(text) {
  if (typeof text === "string" && text.trimStart().charAt(0) === "<") {
    throw new Error("SERVER_HTML");
  }
  const data = JSON.parse(text);
  if (data && data.error === "session_expired") {
    handleSessionExpired();
    const err = new Error("session_expired");
    err.isSessionExpired = true;
    throw err;
  }
  return data;
}

function xhrGet(url) {
  if (state.sessionToken) {
    const sep = url.includes("?") ? "&" : "?";
    url += sep + "token=" + encodeURIComponent(state.sessionToken);
  }
  return new Promise(function(resolve, reject) {
    const xhr = new XMLHttpRequest();
    xhr.open("GET", url, true);
    xhr.timeout = XHR_TIMEOUT;
    xhr.onload = function() {
      try { resolve(xhrParseResponse(xhr.responseText)); }
      catch (e) { reject(e); }
    };
    xhr.onerror = function() { reject(new Error("Network error")); };
    xhr.ontimeout = function() { reject(new Error("Timeout")); };
    xhr.send();
  });
}

function xhrPost(url, payload, options) {
  if (state.sessionToken && !payload.token) {
    payload = Object.assign({}, payload, { token: state.sessionToken });
  }
  options = options || {};
  const timeout = options.timeout || XHR_TIMEOUT;
  // API call 也算「活著」,重置 idle 計時器
  resetIdleTimer();
  return new Promise(function(resolve, reject) {
    const xhr = new XMLHttpRequest();
    xhr.open("POST", url, true);
    xhr.setRequestHeader("Content-Type", "text/plain");
    xhr.timeout = timeout;
    xhr.onload = function() {
      try { resolve(xhrParseResponse(xhr.responseText)); }
      catch (e) { reject(e); }
    };
    xhr.onerror = function() { reject(new Error("Network error")); };
    xhr.ontimeout = function() { reject(new Error("Timeout")); };
    xhr.send(JSON.stringify(payload));
  });
}

/* ══════════════════════════════════════════════════════════════════════════════
   idle 計時器(A3:閒置 15 分鐘自動登出)
   ══════════════════════════════════════════════════════════════════════════════ */
function resetIdleTimer() {
  if (state.idleTimerId) clearTimeout(state.idleTimerId);
  // 只在 main 頁面啟用 idle 計時(login / auth 頁不用)
  if (!document.getElementById("pageMain").classList.contains("active")) return;
  state.idleTimerId = setTimeout(function() {
    handleIdleTimeout();
  }, IDLE_TIMEOUT_MS);
}

function bindIdleListeners() {
  // 任何使用者操作都重置計時(對齊 A3:(i)+(ii) 結合)
  ["mousedown", "touchstart", "keydown", "scroll"].forEach(function(evt) {
    window.addEventListener(evt, resetIdleTimer, { passive: true });
  });
}

function handleIdleTimeout() {
  // 後台 logout(不等 response)
  if (state.lineId) {
    xhrPost(API_URL, { action: "therapistLogout", lineId: state.lineId })
      .catch(function() {});
  }
  // 清狀態 + 顯示登入頁附說明
  state.sessionToken = "";
  clearSessionFromStorage();
  showPage("pageLogin");
  document.getElementById("loginInfo").style.display = "block";
  document.getElementById("loginError").style.display = "none";
  document.getElementById("loginPassword").value = "";
  setTimeout(function() {
    document.getElementById("loginPassword").focus();
  }, 100);
}

/* ══════════════════════════════════════════════════════════════════════════════
   頁面切換 + utility
   ══════════════════════════════════════════════════════════════════════════════ */
function showPage(id) {
  document.querySelectorAll(".page").forEach(function(p) {
    p.classList.remove("active");
    // v0.3 修補:三個 page 的 default display 全部 reset 成 none(避免 pageAuth 永遠顯示的疊加 bug)
    p.style.display = "none";
  });
  const target = document.getElementById(id);
  if (target) {
    target.classList.add("active");
    if (id === "pageAuth") target.style.display = "flex";
    if (id === "pageLogin") target.style.display = "flex";
    if (id === "pageMain") target.style.display = "block";
  }
}

function esc(str) {
  return String(str || "")
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}

/**
 * v0.5:金額千分位格式化(對齊 v2 設計)
 * 3000 → "3,000"
 * 非數字或空 → 直接 esc 後回傳(避免破壞既有資料)
 */
function _fmtMoney(val) {
  const s = String(val == null ? "" : val).trim();
  if (s === "" || isNaN(Number(s))) return esc(s);
  return Number(s).toLocaleString("en-US");
}

function todayYMD() {
  const d = new Date();
  return d.getFullYear() + "/" + String(d.getMonth() + 1).padStart(2, "0") + "/" + String(d.getDate()).padStart(2, "0");
}

function ymdParts(d) {
  return d.getFullYear() + "/" + String(d.getMonth() + 1).padStart(2, "0") + "/" + String(d.getDate()).padStart(2, "0");
}

function weekdayName(jsDay) {
  // JS getDay(): 0=Sun, 1=Mon, ..., 6=Sat
  // L17 月曆顯示週一到週六(週日休)
  const names = ["日", "一", "二", "三", "四", "五", "六"];
  return names[jsDay];
}

/* ══════════════════════════════════════════════════════════════════════════════
   LIFF init + 啟動流程
   ══════════════════════════════════════════════════════════════════════════════ */
async function bootstrap() {
  try {
    // 警示 placeholder LIFF ID(粟醫師上線前必填)
    if (LIFF_ID === "REPLACE_WITH_THERAPY_LIFF_ID") {
      // 開發階段允許跳過 LIFF(用 URL ?devLineId=Uxxx 直接測)
      const params = new URLSearchParams(location.search);
      const devLineId = params.get("devLineId");
      if (devLineId) {
        state.lineId = devLineId;
        proceedAfterLineId();
        return;
      }
      authShowError("尚未設定 LIFF", "請先在 LINE Developers 申請 LIFF 並填入 LIFF_ID。或用 ?devLineId=Uxxx 開發測試。");
      return;
    }

    await liff.init({ liffId: LIFF_ID });
    if (!liff.isLoggedIn()) { liff.login(); return; }
    const profile = await liff.getProfile();
    state.lineId = profile.userId;
    proceedAfterLineId();
  } catch (e) {
    authShowError("連線錯誤", "無法初始化 LIFF。請檢查網路連線後重新載入。");
  }
}

async function proceedAfterLineId() {
  try {
    // 第一關:白名單快速檢查(不帶密碼)
    const check = await xhrGet(API_URL + "?action=verifyTherapistLogin&lineId=" + encodeURIComponent(state.lineId) + "&password=");
    if (check.error === "權限不足") {
      authShowError("權限不足", "您不在心理治療系統的治療師名單內。");
      return;
    }
    // check.error === "需要密碼" → 白名單通過,看有沒有 session 可恢復
    const saved = loadSessionFromStorage();
    if (saved && saved.lineId === state.lineId) {
      state.sessionToken = saved.sessionToken;
      state.myName = saved.myName;
      state.isOwner = saved.isOwner;
      state.loginTime = saved.loginTime;
      enterMainPage();
      return;
    }
    // 沒 session,顯示登入頁
    showPage("pageLogin");
    setTimeout(function() {
      document.getElementById("loginPassword").focus();
    }, 100);
  } catch (e) {
    if (e.isSessionExpired) return;
    authShowError("連線錯誤", "無法驗證身份,請稍後再試。");
  }
}

function authShowError(title, sub) {
  document.getElementById("authMark").textContent = "—";
  document.getElementById("authTitle").textContent = title;
  document.getElementById("authSub").textContent = sub;
  document.getElementById("authActions").style.display = "block";
}

/* ══════════════════════════════════════════════════════════════════════════════
   登入 / 登出
   ══════════════════════════════════════════════════════════════════════════════ */
let isLoggingIn = false;
async function doTherapistLogin() {
  if (isLoggingIn) return;
  const pwEl = document.getElementById("loginPassword");
  const errEl = document.getElementById("loginError");
  const infoEl = document.getElementById("loginInfo");
  const btn = document.getElementById("btnLogin");
  errEl.style.display = "none";
  infoEl.style.display = "none";
  const password = pwEl.value;
  if (!password) {
    errEl.textContent = "請輸入密碼";
    errEl.style.display = "block";
    return;
  }
  isLoggingIn = true;
  btn.disabled = true; btn.textContent = "驗證中";
  try {
    const data = await xhrPost(API_URL, {
      action: "requestTherapistSession",
      lineId: state.lineId,
      password: password
    });
    if (data.success) {
      state.sessionToken = data.token;
      state.myName = data.name || "";
      state.isOwner = !!data.isOwner;
      state.loginTime = new Date().toLocaleTimeString("zh-TW", { hour: "2-digit", minute: "2-digit" });
      saveSessionToStorage();
      pwEl.value = "";
      enterMainPage();
    } else if (data.error === "locked") {
      errEl.textContent = "登入失敗次數過多,請稍後再試。";
      errEl.style.display = "block";
      btn.disabled = false; btn.textContent = "登入";
    } else if (data.error === "wrong_password") {
      pwEl.value = ""; pwEl.focus();
      const rem = data.remaining || 0;
      errEl.textContent = "密碼錯誤(剩餘 " + rem + " 次)";
      errEl.style.display = "block";
      btn.disabled = false; btn.textContent = "登入";
    } else {
      errEl.textContent = data.error || "登入失敗,請稍後再試。";
      errEl.style.display = "block";
      btn.disabled = false; btn.textContent = "登入";
    }
  } catch (e) {
    if (e.isSessionExpired) return;
    errEl.textContent = "連線異常,請稍後再試。";
    errEl.style.display = "block";
    btn.disabled = false; btn.textContent = "登入";
  } finally {
    isLoggingIn = false;
  }
}

function doTherapistLogout() {
  // 後台清 cache(不等 response)
  if (state.lineId && state.sessionToken) {
    xhrPost(API_URL, { action: "therapistLogout", lineId: state.lineId })
      .catch(function() {});
  }
  state.sessionToken = "";
  state.myName = "";
  state.isOwner = false;
  state.loginTime = "";
  clearSessionFromStorage();
  if (state.idleTimerId) clearTimeout(state.idleTimerId);
  showPage("pageLogin");
  document.getElementById("loginPassword").value = "";
  document.getElementById("loginError").style.display = "none";
  document.getElementById("loginInfo").style.display = "none";
  setTimeout(function() {
    document.getElementById("loginPassword").focus();
  }, 100);
}

function handleSessionExpired() {
  state.sessionToken = "";
  clearSessionFromStorage();
  if (state.idleTimerId) clearTimeout(state.idleTimerId);
  showPage("pageLogin");
  const errEl = document.getElementById("loginError");
  errEl.textContent = "登入已過期,請重新登入。";
  errEl.style.display = "block";
  document.getElementById("loginPassword").value = "";
  document.getElementById("btnLogin").disabled = false;
  document.getElementById("btnLogin").textContent = "登入";
  setTimeout(function() {
    document.getElementById("loginPassword").focus();
  }, 100);
}

/* ══════════════════════════════════════════════════════════════════════════════
   主頁進入(載入治療師分頁列 + 預設選自己 + 拉資料)
   ══════════════════════════════════════════════════════════════════════════════ */
async function enterMainPage() {
  showPage("pageMain");
  document.getElementById("meName").textContent = state.myName + (state.isOwner ? " · OWNER" : "");
  resetIdleTimer();

  try {
    const data = await xhrPost(API_URL, {
      action: "getMyVisibleTherapists",
      lineId: state.lineId
    });
    if (!data.success) {
      throw new Error(data.error || "未知錯誤");
    }
    state.visibleTherapists = data.visibleTherapists || [];
    state.selectedTherapist = data.myName || (state.visibleTherapists[0] || "");
    renderTherapistTabs();
    await loadAndRenderEntries();
  } catch (e) {
    if (e.isSessionExpired) return;
    document.getElementById("todayList").innerHTML =
      '<div class="empty-hint">載入失敗:' + esc(e.message || "未知錯誤") + '</div>';
  }
}

function renderTherapistTabs() {
  const wrap = document.getElementById("therapistTabs");
  wrap.innerHTML = "";
  state.visibleTherapists.forEach(function(name) {
    const btn = document.createElement("button");
    btn.className = "therapist-tab" + (name === state.selectedTherapist ? " active" : "");
    btn.textContent = name;
    btn.onclick = function() { switchTherapist(name); };
    wrap.appendChild(btn);
  });
}

async function switchTherapist(name) {
  if (name === state.selectedTherapist) return;
  state.selectedTherapist = name;
  // 換治療師排班不一樣,清 schedule cache
  _scheduleCache = null;
  // 收乾淨所有展開的表單(避免在錯誤治療師 context 下殘留)
  collapseAllAddBlocks();
  // v0.3:同時收回整個新增 section
  const addSection = document.getElementById("addSection");
  if (addSection) {
    addSection.classList.remove("section-expanded");
    const icon = document.getElementById("addSectionIcon");
    if (icon) icon.textContent = "+";
  }
  document.querySelectorAll(".therapist-tab").forEach(function(b) {
    b.classList.toggle("active", b.textContent === name);
  });
  // 唯讀提示條
  const banner = document.getElementById("readonlyBanner");
  if (state.isOwner && name !== state.myName) {
    banner.textContent = "目前為唯讀檢視:" + name;
    banner.classList.add("visible");
  } else {
    banner.classList.remove("visible");
  }
  await loadAndRenderEntries();
}

/* ══════════════════════════════════════════════════════════════════════════════
   sub-tab 切換
   ══════════════════════════════════════════════════════════════════════════════ */
function switchSubtab(name) {
  state.subtab = name;
  document.querySelectorAll(".subtab").forEach(function(b) {
    b.classList.toggle("active", b.dataset.subtab === name);
  });
  document.getElementById("paneDisplay").style.display = (name === "display") ? "" : "none";
  document.getElementById("paneOperation").style.display = (name === "operation") ? "" : "none";

  // v0.5:切換到目標分頁時,重觸發 stagger fade-in 動畫
  // (CSS animation 只在元素首次出現時跑,display none↔block 不會重觸發)
  const visiblePane = (name === "display") ? "paneDisplay" : "paneOperation";
  const sections = document.querySelectorAll("#" + visiblePane + " > .section");
  sections.forEach(function(sec, i) {
    sec.style.animation = "none";
    // 強制 reflow 讓 animation 重置
    void sec.offsetWidth;
    sec.style.animation = "sectionFadeIn 0.4s ease-out " + (i * 0.05) + "s backwards";
  });

  if (name === "display") {
    // 切回 [顯示] 時收乾淨所有 expandable 表單(對齊 abstinence:不誘導頻繁動)
    collapseAllAddBlocks();
    // v0.3:同時收回整個新增 section
    const section = document.getElementById("addSection");
    if (section) {
      section.classList.remove("section-expanded");
      const icon = document.getElementById("addSectionIcon");
      if (icon) icon.textContent = "+";
    }
  } else if (name === "operation") {
    renderOperationPane();
  }
}

/* ══════════════════════════════════════════════════════════════════════════════
   讀資料 + 算今天/本週/候補
   ══════════════════════════════════════════════════════════════════════════════ */
async function loadAndRenderEntries() {
  // v6.0 Step 4-A 方案 C:用 local overlay 取代 inline「載入中...」
  // 副標顯示當前切到哪位治療師,給「轉場」清楚暗示
  const subText = state.selectedTherapist
    ? "loading · " + state.selectedTherapist
    : "loading entries";
  showLocalOverlay("paneDisplay", "載入中", subText);

  // 清空底層內容(被 overlay 蓋住,但避免殘留前次資料閃現)
  document.getElementById("todayList").innerHTML = "";
  document.getElementById("weekGrid").innerHTML = "";
  document.getElementById("waitlistSummary").innerHTML = "";

  try {
    const data = await xhrPost(API_URL, {
      action: "getTherapistRawEntries",
      lineId: state.lineId,
      targetTherapist: state.selectedTherapist
    });
    if (!data.success) {
      throw new Error(data.error || "未知錯誤");
    }
    state.rawEntries = data;
    renderToday();
    renderWeek();
    renderWaitlist();
    renderOperationPane();
  } catch (e) {
    if (e.isSessionExpired) return;
    document.getElementById("todayList").innerHTML =
      '<div class="empty-hint">載入失敗:' + esc(e.message || "未知錯誤") + '</div>';
  } finally {
    hideLocalOverlay("paneDisplay");
  }
}

/**
 * 算指定日期該治療師會發生的 case
 * 演算法精簡版(對齊 backend getTherapyCases line 6850 區段):
 *   1. layer1 active 列,若 weekday 對 + date >= startDate → 候選
 *   2. layer1_5 active 蓋掉(同 date + 同 startTime)
 *   3. layer2 active 直接加(若 date 一致)
 * 排序:startTime asc
 */
function expandCasesForDate(targetYMD) {
  if (!state.rawEntries) return [];
  const cases = [];
  const targetDate = parseYMD(targetYMD);
  if (!targetDate) return [];
  const targetWeekday = targetDate.getDay() === 0 ? 7 : targetDate.getDay(); // 週日 0→7,週一 1
  // L9 / sheet schema:weekday 1-6 = 週一到週六

  // layer1 展開
  (state.rawEntries.layer1 || []).forEach(function(entry) {
    if (entry.status !== "active") return;
    if (parseInt(entry.weekday, 10) !== targetWeekday) return;
    const start = parseYMD(entry.startDate);
    if (!start || targetDate < start) return;
    // 檢查 layer1_5 shadow
    const shadowed = (state.rawEntries.layer1_5 || []).some(function(s) {
      return s.status === "active"
        && s.name === entry.name
        && s.date === targetYMD
        && s.startTime === entry.startTime;
    });
    if (shadowed) return;
    cases.push({
      startTime: entry.startTime,
      endTime: entry.endTime,
      name: entry.name,
      tag: "L1",
      room: entry.room || "",
      layerId: entry.layerId
    });
  });

  // layer2 加入
  (state.rawEntries.layer2 || []).forEach(function(entry) {
    if (entry.status !== "active") return;
    if (entry.date !== targetYMD) return;
    cases.push({
      startTime: entry.startTime,
      endTime: entry.endTime,
      name: entry.name,
      tag: "L2",
      room: entry.room || "",
      layerId: entry.layerId
    });
  });

  // 排序 startTime asc(HH:MM 字串可直接比對)
  cases.sort(function(a, b) {
    return a.startTime < b.startTime ? -1 : (a.startTime > b.startTime ? 1 : 0);
  });
  return cases;
}

function parseYMD(ymd) {
  if (!ymd || typeof ymd !== "string") return null;
  const m = ymd.match(/^(\d{4})\/(\d{1,2})\/(\d{1,2})$/);
  if (!m) return null;
  const d = new Date(parseInt(m[1], 10), parseInt(m[2], 10) - 1, parseInt(m[3], 10));
  d.setHours(0, 0, 0, 0);
  return d;
}

/**
 * 衝堂判斷:同治療師同一天兩個 case 的時段重疊就是衝堂
 * 用於今天區塊的 1px 灰線連結(L14)
 */
function isOverlap(caseA, caseB) {
  // 時段格式 "HH:MM" 字串可直接比較
  return caseA.startTime < caseB.endTime && caseB.startTime < caseA.endTime;
}

/* ── 渲染今天區塊 ───────────────────────────── */
function renderToday() {
  const todayStr = todayYMD();
  const todayDate = new Date();
  document.getElementById("todayMeta").textContent =
    todayStr + " · 週" + weekdayName(todayDate.getDay());

  const cases = expandCasesForDate(todayStr);
  const list = document.getElementById("todayList");
  if (cases.length === 0) {
    list.innerHTML = '<div class="empty-hint">— empty —</div>';
    return;
  }
  let html = "";
  cases.forEach(function(c, idx) {
    const next = cases[idx + 1];
    const conflict = next && isOverlap(c, next);
    html += '<div class="case-row' + (conflict ? ' conflict-with-next' : '') + '">'
         +    '<div class="case-time">' + esc(c.startTime) + '–' + esc(c.endTime) + '</div>'
         +    '<div class="case-name">' + esc(c.name)
         +      (c.room ? '<span class="case-room">· ' + esc(c.room) + '室</span>' : '')
         +    '</div>'
         +    '<div class="case-tag tag-' + c.tag.toLowerCase() + '">' + esc(c.tag) + '</div>'
         +  '</div>';
  });
  list.innerHTML = html;
}

/* ── 渲染本週月曆 ───────────────────────────── */
function renderWeek() {
  // L17:本週週一到週六(週日休不顯示)
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  const dayOfWeek = today.getDay(); // 0=Sun, 1=Mon, ...
  const monday = new Date(today);
  // 算這週的週一(若今天是週日,顯示**下週**的週一?還是本週剛過?)
  // 簡化:dayOfWeek==0 視為本週的尾巴 → 顯示這週週一(已過)到週六(已過)
  // 實際情境:粟醫師休週日,週日打開應該看下週,但 v6.0 第一版不做跨週切換
  // 折中:dayOfWeek==0 顯示下週 一~六(粟醫師週日打開都是看下週準備用)
  const offset = (dayOfWeek === 0) ? 1 : (1 - dayOfWeek);
  monday.setDate(today.getDate() + offset);

  document.getElementById("weekMeta").textContent =
    ymdParts(monday) + " ─ " + ymdParts(new Date(monday.getTime() + 5 * 86400000));

  let html = "";
  for (let i = 0; i < 6; i++) {
    const d = new Date(monday.getTime() + i * 86400000);
    const dStr = ymdParts(d);
    const isToday = (dStr === todayYMD());
    const cases = expandCasesForDate(dStr);
    let inner = "";
    cases.forEach(function(c) {
      inner += '<div class="week-case">'
            +    '<span class="week-time">' + esc(c.startTime) + '</span>'
            +    esc(c.name)
            +  '</div>';
    });
    if (cases.length === 0) inner = '<div class="empty-hint" style="padding:0;font-size:11px;">—</div>';
    html += '<div class="week-day' + (isToday ? ' is-today' : '') + '">'
         +    '<div class="week-day-head">'
         +      '<span class="week-day-name">週' + weekdayName(d.getDay()) + '</span>'
         +      '<span class="week-day-date">' + (d.getMonth() + 1) + '/' + d.getDate() + '</span>'
         +    '</div>'
         +    inner
         +  '</div>';
  }
  document.getElementById("weekGrid").innerHTML = html;
}

/* ── 渲染候補區塊 ───────────────────────────── */
function renderWaitlist() {
  const layer3 = (state.rawEntries.layer3 || []).filter(function(e) {
    return e.status === "active";
  });
  document.getElementById("waitlistMeta").textContent = layer3.length;
  const wrap = document.getElementById("waitlistSummary");
  if (layer3.length === 0) {
    wrap.innerHTML = '<div class="empty-hint">— empty —</div>';
    return;
  }
  let html = "";
  layer3.forEach(function(entry, idx) {
    let slotsCount = 0;
    try {
      const slots = JSON.parse(entry.slots || "[]");
      slotsCount = slots.length;
    } catch (e) { /* JSON 異常顯示 0 */ }
    html += '<div class="waitlist-row" onclick="openWaitlistDetail(' + idx + ')">'
         +    '<span class="waitlist-name">' + esc(entry.name) + ' · 期待 ' + esc(entry.freq) + ' 次</span>'
         +    '<span class="waitlist-meta">' + slotsCount + ' 個時段</span>'
         +  '</div>';
  });
  wrap.innerHTML = html;
}

function openWaitlistDetail(idx) {
  const entry = (state.rawEntries.layer3 || []).filter(function(e) {
    return e.status === "active";
  })[idx];
  if (!entry) return;
  let slots = [];
  try { slots = JSON.parse(entry.slots || "[]"); } catch (e) {}
  const periodMap = { morning: "早上", afternoon: "下午", evening: "晚上" };
  const weekdayMap = ["", "一", "二", "三", "四", "五", "六", "日"];
  let slotsHtml = "";
  if (slots.length === 0) {
    slotsHtml = '<div class="empty-hint">沒有期待時段</div>';
  } else {
    slotsHtml = '<div style="display:flex;flex-wrap:wrap;gap:8px;">';
    slots.forEach(function(s) {
      slotsHtml += '<span style="border:1px solid var(--line-2);padding:4px 10px;font-size:12px;letter-spacing:1px;color:var(--concrete);">'
                +  '週' + (weekdayMap[s.weekday] || "?") + ' ' + (periodMap[s.period] || s.period)
                +  '</span>';
    });
    slotsHtml += '</div>';
  }
  const created = entry.createdDate || "—";
  document.getElementById("modalWaitlistTitle").textContent = entry.name + " · 候補";
  document.getElementById("modalWaitlistBody").innerHTML =
    '<div style="font-size:12px;color:var(--ash);letter-spacing:1px;margin-bottom:12px;">'
    + '登記:' + esc(created) + ' · 期待 ' + esc(entry.freq) + ' 次/週'
    + '</div>'
    + '<div style="font-size:12px;color:var(--concrete);letter-spacing:1px;margin-bottom:8px;">期待時段</div>'
    + slotsHtml;
  document.getElementById("modalWaitlist").classList.add("visible");
}

function closeWaitlistModal() {
  document.getElementById("modalWaitlist").classList.remove("visible");
}

// 是否為唯讀檢視:OWNER 切到別人 tab

}

// v0.3:整段新增 section 收合
function toggleAddSection() {

    section.classList.remove("section-expanded");

  } else {

function toggleAddBlock(layer) {
  const block = document.querySelector('.add-block[data-add="' + layer + '"]');
  if (!block) return;

// THERAPIST_SCHEDULE 在前端是空的(排班從 backend 來),demo 模式可從 DEMO_SCHEDULE 注入
// 真實環境:Step 3-B 載入 therapy.html 時呼叫 getTherapistSchedule 拿
let _scheduleCache = null;

async function loadScheduleIfNeeded() {
  if (_scheduleCache) return _scheduleCache;
  try {
    const data = await xhrPost(API_URL, {
      action: "getTherapistSchedule",
      therapistName: state.selectedTherapist
    });
    if (data && data.success) {
      _scheduleCache = data.schedule || [];
    } else {
      _scheduleCache = [];
    }
  } catch (e) {
    _scheduleCache = [];
  }
  return _scheduleCache;
}

// 拿某 weekday 的排班 slots
function scheduleSlotsForWeekday(weekday) {
  if (!_scheduleCache) return [];
  const day = _scheduleCache.find(function(d) { return parseInt(d.weekday, 10) === parseInt(weekday, 10); });
  return day ? (day.slots || []) : [];
}

// L1 時段下拉
async function initLayer1SlotDropdown() {
  await loadScheduleIfNeeded();
  const wd = parseInt(document.getElementById("l1_weekday").value, 10);
  const slots = scheduleSlotsForWeekday(wd);
  const sel = document.getElementById("l1_slot");
  sel.innerHTML = "";
  if (slots.length === 0) {
    sel.innerHTML = '<option value="">(此天無排班,請使用非排班時段)</option>';
  } else {
    slots.forEach(function(s) {
      const opt = document.createElement("option");
      opt.value = s.start + "-" + s.end;
      opt.textContent = s.start + " – " + s.end;
      sel.appendChild(opt);
    });
  }
}

// 切換 L1 weekday 時要重 load slots
function onL1WeekdayChange() {
  initLayer1SlotDropdown();
}

// L2 日期變化 → load 該天的排班 slots
async function onL2DateChange() {
  await loadScheduleIfNeeded();
  const dateStr = document.getElementById("l2_date").value; // YYYY-MM-DD
  if (!dateStr) {
    document.getElementById("l2_slot").innerHTML = '<option value="">— 請先選日期 —</option>';
    return;
  }
  // 用 split 解析,避免時區問題(new Date(YYYY-MM-DD) 是 UTC midnight,在某些時區會差一天)
  const parts = dateStr.split("-");
  const d = new Date(parseInt(parts[0], 10), parseInt(parts[1], 10) - 1, parseInt(parts[2], 10));
  let wd = d.getDay();
  if (wd === 0) wd = 7; // 週日
  const slots = scheduleSlotsForWeekday(wd);
  const sel = document.getElementById("l2_slot");
  sel.innerHTML = "";
  if (slots.length === 0) {
    sel.innerHTML = '<option value="">(此天無排班,請使用非排班時段)</option>';
  } else {
    slots.forEach(function(s) {
      const opt = document.createElement("option");
      opt.value = s.start + "-" + s.end;
      opt.textContent = s.start + " – " + s.end;
      sel.appendChild(opt);
    });
  }
}

// 自訂時段切換鈕(L1 / L2 共用)
function toggleCustomSlot(prefix) {
  const slotSel = document.getElementById(prefix + "_slot");
  const customStartWrap = document.getElementById(prefix + "_customStartWrap");
  const customEndWrap = document.getElementById(prefix + "_customEndWrap");
  const toggle = document.querySelector('[onclick="toggleCustomSlot(\'' + prefix + '\')"]');
  const isCustom = customStartWrap.style.display !== "none";
  if (isCustom) {
    customStartWrap.style.display = "none";
    customEndWrap.style.display = "none";
    slotSel.disabled = false;
    if (toggle) toggle.textContent = "使用非排班時段";
  } else {
    customStartWrap.style.display = "";
    customEndWrap.style.display = "";
    slotSel.disabled = true;
    if (toggle) toggle.textContent = "改回排班內時段";
  }
}

function resetCustomSlot(prefix) {
  document.getElementById(prefix + "_customStartWrap").style.display = "none";
  document.getElementById(prefix + "_customEndWrap").style.display = "none";
  const slotSel = document.getElementById(prefix + "_slot");
  if (slotSel) slotSel.disabled = false;
  const toggle = document.querySelector('[onclick="toggleCustomSlot(\'' + prefix + '\')"]');
  if (toggle) toggle.textContent = "使用非排班時段";
}

// L3 期待時段 checkboxes(從排班動態生成,只列有排班的格)
async function initLayer3SlotsCheckboxes() {
  await loadScheduleIfNeeded();
  const wrap = document.getElementById("l3_slots");
  wrap.innerHTML = "";
  if (!_scheduleCache || _scheduleCache.length === 0) {
    wrap.innerHTML = '<div class="empty-hint" style="grid-column:1/-1;">無排班資料</div>';
    return;
  }
  const wdNames = ["", "週一", "週二", "週三", "週四", "週五", "週六"];
  const periodNames = { morning: "早上", afternoon: "下午", evening: "晚上" };
  // 蒐集所有「(weekday, period)」獨特 pair
  const seen = {};
  _scheduleCache.forEach(function(d) {
    (d.slots || []).forEach(function(s) {
      const key = d.weekday + "|" + s.period;
      if (!seen[key]) seen[key] = { weekday: d.weekday, period: s.period };
    });
  });
  // 排序:weekday asc → period(morning < afternoon < evening)
  const periodOrder = { morning: 1, afternoon: 2, evening: 3 };
  const items = Object.values(seen).sort(function(a, b) {
    if (a.weekday !== b.weekday) return a.weekday - b.weekday;
    return periodOrder[a.period] - periodOrder[b.period];
  });
  items.forEach(function(it) {
    const id = "l3_chk_" + it.weekday + "_" + it.period;
    const label = document.createElement("label");
    label.className = "checkbox-item";
    label.innerHTML =
      '<input type="checkbox" id="' + id + '" data-weekday="' + it.weekday + '" data-period="' + it.period + '">'
      + '<span>' + wdNames[it.weekday] + " " + periodNames[it.period] + '</span>';
    label.querySelector("input").addEventListener("change", function(ev) {
      label.classList.toggle("checked", ev.target.checked);
    });
    wrap.appendChild(label);
  });
}

/**
 * v6.0 Step 4-A 方案 C:submit busy 狀態
 *   - btnId:送出按鈕的 id(L1: btnSubmitL1, L1.5: btnSubmitL15, L2: btnSubmitL2, L3: btnSubmitL3)
 *   - busy: true=進入送出中 / false=結束
 *   - formId(可選):若提供,form 容器同步淡化 + 阻擋互動。預設用 btnId 反推
 *
 * 升級點(對齊 v0.5 mock 方案 C):
 *   1. form 容器 .form-busy → opacity 0.4 + pointer-events:none
 *   2. 按鈕保持實體不淡化,內容換成「● ● ●」三點脈動
 *   3. 結束時恢復原狀
 */
function setFormBusy(btnId, busy, formId) {
  const btn = document.getElementById(btnId);
  if (!btn) return;

  // formId 自動推導(對齊既有命名:btnSubmitL1 → addFormLayer1)
  if (!formId) {
    if (btnId === "btnSubmitL1")  formId = "addFormLayer1";
    if (btnId === "btnSubmitL15") formId = "addFormLayer1_5";
    if (btnId === "btnSubmitL2")  formId = "addFormLayer2";
    if (btnId === "btnSubmitL3")  formId = "addFormLayer3";
  }
  const form = formId ? document.getElementById(formId) : null;

  if (busy) {
    btn.disabled = true;
    btn.dataset.label = btn.textContent;
    // 三點脈動取代「送出中」文字
    btn.innerHTML = '<span class="btn-dots"><span></span><span></span><span></span></span>';
    if (form) form.classList.add("form-busy");
  } else {
    btn.disabled = false;
    btn.textContent = btn.dataset.label || "新增";
    if (form) form.classList.remove("form-busy");
  }
}

/**
 * v6.0 Step 4-A 方案 C:load 場景的 local overlay
 *   - 把指定容器設為 has-local-overlay(position:relative),內部插入一層 .local-overlay
 *   - text:中央顯示文字,例「載入中」
 *   - subText(可選):副標 mono italic,例「switching therapist · 王」
 *   - 用法:showLocalOverlay("paneDisplay", "載入中", "switching therapist · 王")
 */
function showLocalOverlay(containerId, text, subText) {
  const container = document.getElementById(containerId);
  if (!container) return;
  // 防重複插入:先清掉舊的
  hideLocalOverlay(containerId);
  container.classList.add("has-local-overlay");

  const overlay = document.createElement("div");
  overlay.className = "local-overlay";
  overlay.dataset.localOverlay = "1"; // 給 hideLocalOverlay 找

  const dots = document.createElement("div");
  dots.className = "local-overlay-dots";
  dots.innerHTML = "<span></span><span></span><span></span>";
  overlay.appendChild(dots);

  if (text) {
    const t = document.createElement("div");
    t.className = "local-overlay-text";
    t.textContent = text;
    overlay.appendChild(t);
  }
  if (subText) {
    const s = document.createElement("div");
    s.className = "local-overlay-sub";
    s.textContent = subText;
    overlay.appendChild(s);
  }
  container.appendChild(overlay);
}

function hideLocalOverlay(containerId) {
  const container = document.getElementById(containerId);
  if (!container) return;
  const existing = container.querySelector('[data-local-overlay="1"]');
  if (existing) existing.remove();
  // 不移除 has-local-overlay class(維持 position:relative,下次顯示時不需重設)
}

// 拿時段(從 select 或 custom input)
function readSlot(prefix) {
  const customWrap = document.getElementById(prefix + "_customStartWrap");
  if (customWrap.style.display !== "none") {
    return {
      startTime: document.getElementById(prefix + "_customStart").value,
      endTime: document.getElementById(prefix + "_customEnd").value,
      isCustom: true
    };
  }
  const val = document.getElementById(prefix + "_slot").value;
  if (!val) return { startTime: "", endTime: "", isCustom: false };
  const parts = val.split("-");
  return { startTime: parts[0] || "", endTime: parts[1] || "", isCustom: false };
}

  const name = document.getElementById("l1_name").value.trim();

function _renderEntriesGeneric(opts) {
  // opts: { entries, listEl, metaEl, renderInfo, stage1Action, stage2Action, stage1Label, stagedStatuses }
  const list = document.getElementById(opts.listEl);
  const meta = document.getElementById(opts.metaEl);
  const visibleEntries = opts.entries.filter(function(e) { return e.status !== "removed"; });
  meta.textContent = visibleEntries.length; /* v0.5:純數字,v2 設計用 CSS ::before/::after 包 — */
  if (visibleEntries.length === 0) {
    list.innerHTML = '<div class="empty-hint">— empty —</div>';
    return;
  }
  // 排序:active 在前,staged 在後,各自再依 layerId
  visibleEntries.sort(function(a, b) {
    const aStaged = opts.stagedStatuses.indexOf(a.status) !== -1 ? 1 : 0;
    const bStaged = opts.stagedStatuses.indexOf(b.status) !== -1 ? 1 : 0;
    if (aStaged !== bStaged) return aStaged - bStaged;
    return a.layerId < b.layerId ? -1 : 1;
  });
  const readonly = isReadonlyView();
  let html = "";
  visibleEntries.forEach(function(e) {
    const isStaged = opts.stagedStatuses.indexOf(e.status) !== -1;
    const info = opts.renderInfo(e);
    // 注:onclick 引數用 encodeURIComponent 包,接收端 decodeURIComponent
    // 對齊 admin v5.4.5 [C1] 修補 pattern,防 onclick attr 被使用者輸入的 ' 或 < 破壞
    const encLayerId = encodeURIComponent(e.layerId);
    const encLabel = encodeURIComponent(info.shortLabel);
    const encStage1Label = encodeURIComponent(opts.stage1Label);
    const stageBtn = isStaged
      ? '<button class="btn-action btn-action-stage2" '
        + (readonly ? 'disabled title="OWNER 唯讀檢視,不可操作他人 case"' : 'onclick="confirmStage2(\'' + opts.stage2Action + '\',\'' + encLayerId + '\',\'' + encLabel + '\')"')
        + '>移除</button>'
      : '<button class="btn-action" '
        + (readonly ? 'disabled title="OWNER 唯讀檢視,不可操作他人 case"' : 'onclick="confirmStage1(\'' + opts.stage1Action + '\',\'' + encLayerId + '\',\'' + encLabel + '\',\'' + encStage1Label + '\')"')
        + '>' + esc(opts.stage1Label) + '</button>';
    html += '<div class="entry-row' + (isStaged ? ' is-staged' : '') + '" data-layer-id="' + esc(e.layerId) + '">'
         +    '<div class="entry-info">'
         +      '<div class="entry-line-1">' + info.line1 + '</div>'
         +      (info.line2 ? '<div class="entry-line-2">' + info.line2 + '</div>' : '')
         +    '</div>'
         +    '<div class="entry-actions">' + stageBtn + '</div>'
         +  '</div>';
  });
  list.innerHTML = html;
}

/* ── 兩階段刪除 confirm ─────────────────────────────────────── */

let _pendingConfirm = null; // { action, layerId, label }

function confirmStage1(action, layerIdEnc, labelEnc, actionLabelEnc) {
  // 接收端 decodeURIComponent(對齊 admin v5.4.5 [C1] pattern)
  let layerId, label, actionLabel;
  try {
    layerId = decodeURIComponent(layerIdEnc || "");
    label = decodeURIComponent(labelEnc || "");
    actionLabel = decodeURIComponent(actionLabelEnc || "");
  } catch (e) { return; }
  _pendingConfirm = { action: action, layerId: layerId, label: label };
  document.getElementById("modalConfirmTitle").textContent = actionLabel;
  document.getElementById("modalConfirmMsg").innerHTML =
    '確認執行 <strong>' + esc(actionLabel) + '</strong>?<br>'
    + '<span style="color:var(--ash);font-size:12px;letter-spacing:1px;">'
    + esc(label) + '</span><br><br>'
    + '<span style="color:var(--concrete);font-size:12px;">'
    + '完成後該筆會以刪除線顯示,可於下一階段 [移除] 自畫面消除。'
    + '</span>';
  document.getElementById("modalConfirmError").style.display = "none";
  document.getElementById("btnConfirmGo").disabled = false;
  document.getElementById("btnConfirmGo").textContent = "確定";
  document.getElementById("modalConfirm").classList.add("visible");
}

function confirmStage2(action, layerIdEnc, labelEnc) {
  let layerId, label;
  try {
    layerId = decodeURIComponent(layerIdEnc || "");
    label = decodeURIComponent(labelEnc || "");
  } catch (e) { return; }
  _pendingConfirm = { action: action, layerId: layerId, label: label };
  document.getElementById("modalConfirmTitle").textContent = "移除";
  document.getElementById("modalConfirmMsg").innerHTML =
    '確認 <strong>移除</strong> 此筆?<br>'
    + '<span style="color:var(--ash);font-size:12px;letter-spacing:1px;">'
    + esc(label) + '</span><br><br>'
    + '<span style="color:var(--concrete);font-size:12px;">'
    + '畫面將從清單消除。資料保留於試算表供 audit。'
    + '</span>';
  document.getElementById("modalConfirmError").style.display = "none";
  document.getElementById("btnConfirmGo").disabled = false;
  document.getElementById("btnConfirmGo").textContent = "確定移除";
  document.getElementById("modalConfirm").classList.add("visible");
}

function closeConfirmModal() {
  const overlay = document.getElementById("modalConfirm");
  // v0.4-loading-c r2:加 fade-out 過渡
  overlay.classList.add("closing");
  overlay.classList.remove("visible");
  setTimeout(function() {
    overlay.classList.remove("closing", "busy");
  }, 200);
  _pendingConfirm = null;
}

async function executeConfirmAction() {
  if (!_pendingConfirm) return;
  const { action, layerId, label } = _pendingConfirm;
  const overlay = document.getElementById("modalConfirm");
  const btn = document.getElementById("btnConfirmGo");
  const errEl = document.getElementById("modalConfirmError");
  errEl.style.display = "none";

  // v0.4-loading-c r2:進入 busy 狀態(modal 整體淡化 + 按鈕內三點脈動)
  overlay.classList.add("busy");
  btn.disabled = true;
  btn.dataset.label = btn.textContent;
  btn.innerHTML = '<span class="btn-dots"><span></span><span></span><span></span></span>';

  // v0.4-loading-c r2:min-duration 600ms,確保動畫感
  const start = Date.now();
  const MIN_DURATION_MS = 600;

  try {
    const data = await xhrPost(API_URL, {
      action: action,
      lineId: state.lineId,
      layerId: layerId
    });

    if (data.success) {
      // v0.4-loading-c r2:成功路徑才補齊 min-duration(失敗應該立即顯 error)
      const elapsed = Date.now() - start;
      if (elapsed < MIN_DURATION_MS) {
        await new Promise(function(r) { setTimeout(r, MIN_DURATION_MS - elapsed); });
      }
      // 1. 找到對應 entry,加 .entry-removing 觸發收合動畫
      const entryEl = document.querySelector('.entry-row[data-layer-id="' + layerId.replace(/"/g, '\\"') + '"]');
      if (entryEl) {
        entryEl.classList.add("entry-removing");
      }
      // 2. 同步關 modal(fade-out 200ms,跟收合動畫並行)
      closeConfirmModal();
      // 3. 顯示 toast(對齊兩階段語意:stage 1=暫存,stage 2=移除)
      const isStage2 = (action === "removeLayer1" || action === "removeLayer1_5" || action === "removeLayer2" || action === "removeLayer3");
      showToast(isStage2 ? "已移除 · removed" : "已暫存 · staged");
      // 4. 等收合動畫近結束(450ms)再 reload(讓動畫看得完整)
      //    若 entryEl 不存在,直接 reload(保險,避免 stuck)
      const animDelay = entryEl ? 450 : 0;
      setTimeout(async function() {
        try { await loadAndRenderEntries(); } catch(e) { /* loadAndRenderEntries 內部已處理 */ }
      }, animDelay);
    } else {
      // 失敗:恢復 busy 狀態,顯示 error
      overlay.classList.remove("busy");
      errEl.textContent = data.error || "操作失敗";
      errEl.style.display = "block";
      btn.disabled = false;
      btn.innerHTML = btn.dataset.label || "確定";
    }
  } catch (e) {
    if (e.isSessionExpired) return;
    overlay.classList.remove("busy");
    errEl.textContent = e.message || "連線異常";
    errEl.style.display = "block";
    btn.disabled = false;
    btn.innerHTML = btn.dataset.label || "確定";
  }
}

/**
 * v0.4-loading-c r2:Toast(中英並列 mono,工業風)
 *   showToast("已移除 · removed");
 */
function showToast(msg, duration) {
  duration = duration || 1800;
  const el = document.getElementById("therapyToast");
  if (!el) return;
  el.textContent = msg;
  el.classList.add("visible");
  // 防止連續觸發殘留:用 dataset 記 timer id
  if (el._toastTimer) clearTimeout(el._toastTimer);
  el._toastTimer = setTimeout(function() {
    el.classList.remove("visible");
  }, duration);
}

/* ══════════════════════════════════════════════════════════════════════════════
   啟動
   ══════════════════════════════════════════════════════════════════════════════ */
window.addEventListener("DOMContentLoaded", function() {
  bindIdleListeners();
  // Enter 觸發登入
  document.getElementById("loginPassword").addEventListener("keypress", function(ev) {
    if (ev.key === "Enter") doTherapistLogin();
  });
  // modal overlay 點擊關閉
  document.getElementById("modalWaitlist").addEventListener("click", function(ev) {
    if (ev.target.id === "modalWaitlist") closeWaitlistModal();
  });
  document.getElementById("modalConfirm").addEventListener("click", function(ev) {
    if (ev.target.id === "modalConfirm") closeConfirmModal();
  });

  // v0.5:subtabs sticky 偵測 — 用 IntersectionObserver 偵測上方 sentinel,
  // sentinel 滾出 viewport 時 subtabs 已黏住,加微陰影
  try {
    const subtabs = document.querySelector(".subtabs");
    if (subtabs && "IntersectionObserver" in window) {
      // 在 subtabs 上方插入一個 sentinel(0 高度,完全不影響 layout)
      const sentinel = document.createElement("div");
      sentinel.style.cssText = "height:0;pointer-events:none;";
      subtabs.parentNode.insertBefore(sentinel, subtabs);
      const obs = new IntersectionObserver(function(entries) {
        // sentinel 不在 viewport = 已 scroll 過,subtabs 黏住
        subtabs.classList.toggle("is-stuck", !entries[0].isIntersecting);
      });
      obs.observe(sentinel);
    }
  } catch (e) { /* sticky 偵測失敗不影響核心功能 */ }

  bootstrap();
});
</script>
