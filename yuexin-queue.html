<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>悅心診所 · 看診進度</title>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500&family=DM+Sans:wght@200;300;400&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --green: #7AAB5A;
    --green-light: #EBF3E4;
    --green-mid: #C5DEB0;
    --gray: #A8A8A0;
    --text: #3A3A35;
    --bg: #F5F7F2;
    --warn: #C8893E;
  }

  body {
    background: var(--bg);
    font-family: 'Noto Sans TC', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 24px;
    position: relative;
    overflow: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    top: -120px; right: -100px;
    width: 300px; height: 300px;
    background: var(--green-mid);
    opacity: 0.25;
    border-radius: 61% 39% 70% 30% / 45% 55% 45% 55%;
    pointer-events: none;
  }
  body::after {
    content: '';
    position: fixed;
    bottom: -100px; left: -80px;
    width: 260px; height: 260px;
    background: var(--green-mid);
    opacity: 0.2;
    border-radius: 42% 58% 35% 65% / 55% 42% 58% 45%;
    pointer-events: none;
  }

  .header {
    text-align: center;
    margin-bottom: 32px;
    animation: fadeDown 0.7s ease both;
  }

  .clinic-name {
    font-size: 17px;
    font-weight: 500;
    color: var(--text);
    letter-spacing: 0.25em;
  }

  .page-title {
    font-size: 11px;
    font-weight: 300;
    color: var(--gray);
    letter-spacing: 0.2em;
    margin-top: 6px;
  }

  .notice-card {
    background: #fff;
    border-radius: 24px 8px 24px 8px;
    padding: 32px 28px 28px;
    width: 100%;
    max-width: 320px;
    box-shadow: 0 3px 16px rgba(122,171,90,0.12);
    position: relative;
    overflow: hidden;
    animation: fadeUp 0.7s ease 0.15s both;
  }

  .notice-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 4px;
    background: var(--warn);
    border-radius: 4px 4px 0 0;
  }

  .icon-blob {
    width: 56px; height: 56px;
    background: #fdf3e4;
    border-radius: 58% 42% 62% 38% / 44% 56% 44% 56%;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 18px;
  }

  .icon-blob svg {
    width: 28px; height: 28px;
    stroke: var(--warn);
    fill: none;
    stroke-width: 1.8;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .notice-title {
    text-align: center;
    font-size: 16px;
    font-weight: 500;
    color: var(--text);
    letter-spacing: 0.08em;
    margin-bottom: 18px;
  }

  .notice-body {
    font-size: 14px;
    line-height: 1.85;
    color: var(--text);
    text-align: center;
    letter-spacing: 0.04em;
  }

  .notice-body .accent {
    color: var(--warn);
    font-weight: 500;
  }

  .divider {
    height: 1px;
    background: linear-gradient(to right, transparent, #e0e0d8, transparent);
    margin: 22px 0 18px;
  }

  .contact {
    text-align: center;
  }

  .contact-label {
    font-size: 11px;
    color: var(--gray);
    letter-spacing: 0.15em;
    margin-bottom: 4px;
  }

  .contact-sub {
    font-size: 11px;
    color: var(--gray);
    letter-spacing: 0.15em;
    margin-bottom: 10px;
  }

  .phone {
    display: inline-block;
    font-family: 'DM Sans', sans-serif;
    font-size: 22px;
    font-weight: 300;
    color: var(--warn);
    letter-spacing: 0.05em;
    text-decoration: none;
    padding: 6px 16px;
    border: 1px solid #e8c89a;
    border-radius: 999px;
    background: #fdf3e4;
    transition: transform 0.15s ease;
  }
  .phone:active {
    transform: scale(0.97);
  }

  .footer {
    margin-top: 28px;
    font-size: 10px;
    color: #C0C0BA;
    letter-spacing: 0.06em;
    animation: fadeIn 0.8s ease 0.3s both;
  }

  @keyframes fadeDown {
    from { opacity:0; transform: translateY(-16px); }
    to   { opacity:1; transform: translateY(0); }
  }
  @keyframes fadeUp {
    from { opacity:0; transform: translateY(14px); }
    to   { opacity:1; transform: translateY(0); }
  }
  @keyframes fadeIn {
    from { opacity:0; } to { opacity:1; }
  }
</style>
</head>
<body>

<div class="header">
  <div class="clinic-name">悅心診所</div>
  <div class="page-title">即時看診進度</div>
</div>

<div class="notice-card">
  <div class="icon-blob">
    <!-- wrench / 維修扳手 (lucide-style,乾淨對稱) -->
    <svg viewBox="0 0 24 24">
      <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>
    </svg>
  </div>

  <div class="notice-title">叫號系統維修中</div>

  <div class="notice-body">
    現場叫號設備故障無法使用,<br>
    已聯絡廠商維修。<br>
    造成不便,敬請見諒。
  </div>

  <div class="divider"></div>

  <div class="contact">
    <div class="contact-label">如需詢問看診進度</div>
    <div class="contact-sub">請於門診時間來電</div>
    <a href="tel:0736313130" class="phone">07-363-1313</a>
  </div>
</div>

<div class="footer">EST. 2024 YUEXIN PSYCHIATRIC CLINIC</div>

</body>
</html>
