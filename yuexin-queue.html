<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<link rel="icon" href="assets/doctors/yuexinlogo.png" type="image/png">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>悅心診所 看診進度</title>
<meta name="description" content="悅心診所看診進度查詢">
<meta name="version" content="queue-1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta name="author" content="Dr. Su Ning">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500&family=Noto+Sans+TC:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  /*
    ════════════════════════════════════════════════════════════
    悅心診所 看診進度頁(應急版)
    ────────────────────────────────────────────────────────────
    Version: queue v1.0 (2026-05-08)
    背景:    叫號機(mainpi.com)硬體故障,廠商週一(5/12)才能修
    用途:    取代原 mainpi.com WebSocket 進度頁
    機制:    90 秒 polling GAS getEmergencyQueueNumber endpoint
    退場:    5/12 廠商修好後 swap 回原 mainpi.com 進度頁

    設計選擇:
    · 純號碼顯示(粟醫師指定),不混合公告
    · 「最後更新 X 秒前」即時計時器(緩解病人焦慮)
    · 連線狀態指示燈(綠=正常 / 橘=載入中或斷線)
    · 底部小字「叫號系統維修中・人員手動更新」
    · 不依賴 mainpi.com WebSocket
    ════════════════════════════════════════════════════════════
  */
  :root {
    --cream:       #faf8f2;
    --parchment:   #f4f2ec;
    --ink:         #2b2b28;
    --ink-mid:     #4a4a44;
    --ink-light:   #8a8878;
    --ink-dim:     #a8a89a;
    --sage:        #8aaa55;
    --sage-dark:   #5a7a38;
    --sage-deep:   #3e5a25;
    --warn:        #c2860a;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    background: var(--parchment);
  }

  body {
    font-family: 'Noto Sans TC', sans-serif;
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }

  /* ── Header ── */
  .header {
    text-align: center;
    padding: 28px 20px 16px;
    border-bottom: 0.5px solid rgba(74,74,68,0.15);
    background: var(--cream);
  }
  .header h1 {
    font-family: 'Noto Serif TC', serif;
    font-size: 17px;
    font-weight: 500;
    color: var(--sage-deep);
    letter-spacing: 8px;
    padding-left: 8px;
  }
  .header-sub {
    font-size: 11px;
    color: var(--ink-light);
    letter-spacing: 3px;
    margin-top: 4px;
    text-transform: uppercase;
  }

  /* ── Main 號碼區 ── */
  .main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 24px;
  }

  .label {
    font-family: 'Noto Serif TC', serif;
    font-size: 14px;
    font-weight: 500;
    color: var(--ink-light);
    letter-spacing: 6px;
    margin-bottom: 24px;
    padding-left: 6px;
  }

  .number-wrap {
    display: flex;
    align-items: baseline;
    justify-content: center;
    margin-bottom: 18px;
    transition: opacity 0.25s ease;
  }
  .number-wrap.fading {
    opacity: 0.45;
  }

  .number {
    font-family: 'Noto Serif TC', serif;
    font-size: 180px;
    font-weight: 500;
    color: var(--sage-deep);
    line-height: 1;
    letter-spacing: 4px;
  }
  .number-suffix {
    font-family: 'Noto Sans TC', sans-serif;
    font-size: 36px;
    font-weight: 400;
    color: var(--sage-dark);
    margin-left: 14px;
    letter-spacing: 4px;
  }

  /* 尚未啟用 / 載入中 / 錯誤狀態的中間文字 */
  .number.placeholder {
    font-size: 32px;
    font-weight: 400;
    color: var(--ink-light);
    letter-spacing: 4px;
  }

  /* ── 最後更新時間 + 連線狀態 ── */
  .meta {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    font-size: 12px;
    color: var(--ink-light);
    letter-spacing: 1px;
    margin-bottom: 32px;
  }
  .status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--sage);
    transition: background 0.25s ease;
    box-shadow: 0 0 0 2px rgba(138,170,85,0.15);
  }
  .status-dot.warn {
    background: var(--warn);
    box-shadow: 0 0 0 2px rgba(194,134,10,0.15);
  }

  /* ── 載入動畫(初始狀態) ── */
  @keyframes pulse {
    0%, 100% { opacity: 0.4; }
    50% { opacity: 1; }
  }
  .loading-dots {
    display: inline-flex;
    gap: 6px;
    align-items: center;
  }
  .loading-dots span {
    display: inline-block;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--ink-light);
    animation: pulse 1.4s ease-in-out infinite;
  }
  .loading-dots span:nth-child(2) { animation-delay: 0.2s; }
  .loading-dots span:nth-child(3) { animation-delay: 0.4s; }

  /* ── 響應式 ── */
  @media (max-width: 360px) {
    .number { font-size: 140px; }
    .number-suffix { font-size: 28px; }
  }
  @media (min-height: 720px) {
    .number { font-size: 220px; }
  }
</style>
</head>
<body>

<div class="header">
  <h1>悅心診所</h1>
  <div class="header-sub">看診進度</div>
</div>

<div class="main">
  <div class="label">目前看診號</div>
  <div class="number-wrap" id="numberWrap">
    <div class="number placeholder" id="numberDisplay">
      <span class="loading-dots"><span></span><span></span><span></span></span>
    </div>
    <span class="number-suffix" id="numberSuffix" style="display:none;">號</span>
  </div>
  <div class="meta">
    <span class="status-dot" id="statusDot"></span>
    <span id="lastUpdate">載入中</span>
  </div>
</div>



<script>
/*
  ──────────────────────────────────────────────────────────
  Polling 設計:
  · 主時鐘:每 90 秒 fetch 一次 GAS endpoint
  · 副時鐘:每 1 秒更新「最後更新 X 秒前」文字(讓 UI 活著)
  · 不在 LIFF 內,純粹是公開頁,無登入
  · GAS endpoint 是 public(handoff 規格,getEmergencyQueueNumber)
  ──────────────────────────────────────────────────────────
*/

// ⚠️ GAS endpoint 跟 booking.html / admin.html 共用同一個 deployment
//    部署 v5.18 後此 URL 不變,因為 GAS 同一個 deployment 增加新 action 不會改 URL
const API_URL = "https://script.google.com/macros/s/AKfycbxfbtWB6tyWUvFY1r_d26yxdm3Iz6zVALuZgUwLYyqIOHkJrn7TJJADkUE8VPkKOkZkqw/exec";
const POLL_INTERVAL_MS = 90 * 1000;  // 90 秒
const TICK_INTERVAL_MS = 1000;        // 1 秒(更新「X 秒前」文字)

let _lastFetchedAt = null;     // 最後成功 fetch 的時間(Date object)
let _lastUpdatedAt = ""        // GAS 回傳的 updatedAt(字串)
let _consecutiveFails = 0;
let _isFetching = false;       // 防止 polling 與手動觸發互相重疊

function setStatus(state) {
  const dot = document.getElementById("statusDot");
  if (state === "ok") dot.classList.remove("warn");
  else dot.classList.add("warn");
}

function setLastUpdateText(text) {
  document.getElementById("lastUpdate").textContent = text;
}

// 把 updatedAt 字串(yyyy/MM/dd HH:mm:ss)轉成 Date
// GAS 回傳格式固定是這樣
function parseUpdatedAt(str) {
  if (!str) return null;
  // 把 "yyyy/MM/dd HH:mm:ss" 轉成 ISO-like "yyyy-MM-ddTHH:mm:ss"
  const m = str.match(/^(\d{4})\/(\d{2})\/(\d{2})\s+(\d{2}):(\d{2}):(\d{2})$/);
  if (!m) return null;
  return new Date(parseInt(m[1]), parseInt(m[2]) - 1, parseInt(m[3]),
                  parseInt(m[4]), parseInt(m[5]), parseInt(m[6]));
}

function formatRelative(updatedDate) {
  if (!updatedDate) return "—";
  const now = new Date();
  const diffSec = Math.max(0, Math.floor((now - updatedDate) / 1000));
  if (diffSec < 60) return "最後更新 " + diffSec + " 秒前";
  const diffMin = Math.floor(diffSec / 60);
  if (diffMin < 60) return "最後更新 " + diffMin + " 分鐘前";
  const diffHr = Math.floor(diffMin / 60);
  if (diffHr < 24) return "最後更新 " + diffHr + " 小時前";
  return "最後更新 " + Math.floor(diffHr / 24) + " 天前";
}

function tickUpdateText() {
  const updatedDate = parseUpdatedAt(_lastUpdatedAt);
  if (updatedDate) {
    setLastUpdateText(formatRelative(updatedDate));
  } else if (_lastFetchedAt) {
    // 若 GAS 回了但 updatedAt 為空(尚未啟用),用 fetch 時間當 fallback
    setLastUpdateText("最後查詢 " + formatRelative(_lastFetchedAt).replace("最後更新 ", ""));
  }
}

function renderNumber(num) {
  const display = document.getElementById("numberDisplay");
  const suffix = document.getElementById("numberSuffix");
  if (num === null || num === undefined) {
    display.classList.add("placeholder");
    display.textContent = "尚未啟用";
    suffix.style.display = "none";
  } else {
    display.classList.remove("placeholder");
    display.textContent = num;
    suffix.style.display = "";
  }
}

async function fetchNumber() {
  if (_isFetching) return;
  _isFetching = true;

  // 進入 fetching 狀態:燈號變橘、號碼區淡化(避免「假裝有資料」誤導)
  setStatus("warn");
  document.getElementById("numberWrap").classList.add("fading");

  try {
    const res = await fetch(API_URL + "?action=getEmergencyQueueNumber", {
      method: "GET",
      cache: "no-store"
    });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();

    if (data && data.success) {
      renderNumber(data.number);
      _lastUpdatedAt = data.updatedAt || "";
      _lastFetchedAt = new Date();
      _consecutiveFails = 0;
      setStatus("ok");
      tickUpdateText();
    } else {
      throw new Error(data && data.error ? data.error : "unknown");
    }
  } catch(e) {
    _consecutiveFails++;
    setStatus("warn");
    if (_consecutiveFails >= 2) {
      // 連續失敗 → 顯示警告(不改 number,讓使用者仍看到上次的值,只是知道「資料可能舊」)
      // 但若一次都還沒成功過,改顯示「連線異常」
      if (!_lastFetchedAt) {
        const display = document.getElementById("numberDisplay");
        display.classList.add("placeholder");
        display.textContent = "連線異常";
        document.getElementById("numberSuffix").style.display = "none";
        setLastUpdateText("請稍後再試");
      } else {
        setLastUpdateText("連線異常,顯示最後一次資料");
      }
    }
  } finally {
    _isFetching = false;
    document.getElementById("numberWrap").classList.remove("fading");
  }
}

// 啟動:立刻 fetch + 設定主/副時鐘
fetchNumber();
setInterval(fetchNumber, POLL_INTERVAL_MS);
setInterval(tickUpdateText, TICK_INTERVAL_MS);

// 頁面從背景回來時(切回 LINE chat 又切回來)立刻 refresh 一次
// 這對診所的 LIFF 情境很重要:病人切走再切回來會期待看到最新值
document.addEventListener("visibilitychange", function() {
  if (document.visibilityState === "visible") {
    fetchNumber();
  }
});
</script>

</body>
</html>
