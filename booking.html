<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<link rel="icon" href="assets/doctors/yuexinlogo.png" type="image/png">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>悅心診所 線上預約系統</title>
<meta name="description" content="悅心診所線上預約系統 — 系統維護中。">
<meta name="version" content="maintenance">
<meta name="author" content="Dr. Su Ning">
<meta property="og:title" content="悅心診所 線上預約">
<meta property="og:description" content="系統維護中,稍後再試。">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;700&family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ==========================================================
   悅心診所 線上預約 — 維護頁
   ----------------------------------------------------------
   單一頁面,不依賴 LIFF / GAS,完全靜態
   風格對齊 booking.html v5.6.0(Japandi 米色 + sage)
   用途:GitHub Pages 切版用
        - 緊急下架:把這檔改名為 booking.html(原 booking 改名備份)
        - 完工後:改回原檔名
   ========================================================== */
:root {
  color-scheme: light;
  --sage:        #8aaa55;
  --sage-dark:   #5a7a38;
  --sage-deep:   #3e5a25;
  --sage-light:  #e8ede0;
  --sage-mist:   #eef2e6;
  --ink:         #2b2b28;
  --ink-mid:     #4a4a44;
  --ink-light:   #8a8878;
  --cream:       #faf8f2;
  --parchment:   #f4f2ec;
}
html, body {
  margin: 0; padding: 0;
  background: var(--parchment);
  color: var(--ink);
  font-family: 'Noto Sans TC', sans-serif;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  min-height: 100vh;
}
.container {
  max-width: 480px;
  margin: 0 auto;
  padding: 24px 16px;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}
.maintenance-stage {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 20px 0;
  animation: fadeIn 0.5s ease both;
}
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(8px); }
  to   { opacity: 1; transform: translateY(0); }
}
.maintenance-icon {
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: transparent;
  border: 0.5px solid rgba(138,170,85,0.4);
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 22px;
  color: var(--sage-dark);
}
.maintenance-icon svg {
  width: 26px; height: 26px;
  stroke: currentColor;
  stroke-width: 2;
  fill: none;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.maintenance-title {
  font-family: 'Noto Serif TC', serif;
  font-size: 22px;
  font-weight: 500;
  color: var(--sage-deep);
  letter-spacing: 8px;
  padding-left: 8px;
  margin-bottom: 8px;
}
.maintenance-divider {
  width: 24px; height: 1px;
  background: var(--sage-dark);
  margin: 0 auto 24px;
}
.maintenance-msg {
  font-size: 14px;
  color: var(--ink-mid);
  line-height: 2;
  letter-spacing: 1px;
  max-width: 320px;
  margin-bottom: 36px;
}
.maintenance-contact {
  background: var(--cream);
  border: 0.5px solid rgba(74,74,68,0.15);
  border-radius: 4px;
  padding: 22px 24px;
  width: 100%;
  max-width: 340px;
  box-sizing: border-box;
}
.maintenance-contact-label {
  font-size: 11px;
  color: var(--ink-light);
  letter-spacing: 4px;
  margin-bottom: 10px;
}
.maintenance-contact-phone {
  font-family: 'Noto Serif TC', serif;
  font-size: 22px;
  font-weight: 700;
  color: var(--sage-dark);
  letter-spacing: 2px;
  text-decoration: none;
  display: block;
  margin-bottom: 6px;
}
.maintenance-contact-phone:hover {
  color: var(--sage-deep);
}
.maintenance-contact-hours {
  font-size: 11px;
  color: var(--ink-light);
  letter-spacing: 1px;
  line-height: 1.7;
}
.maintenance-footer {
  text-align: center;
  font-size: 10px;
  color: var(--ink-light);
  letter-spacing: 3px;
  padding: 20px 0 8px;
  opacity: 0.7;
}
.maintenance-footer .clinic {
  font-family: 'Noto Serif TC', serif;
  letter-spacing: 4px;
  margin-bottom: 2px;
}
</style>
</head>
<body>

<div class="container">

  <div class="maintenance-stage">

    <div class="maintenance-icon">
      <!-- 工具圖示 -->
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>
      </svg>
    </div>

    <div class="maintenance-title">系統維護中</div>
    <div class="maintenance-divider"></div>

    <div class="maintenance-msg">
      線上預約系統正在進行例行維護,<br>
      預計短時間內恢復,造成不便敬請見諒。
    </div>

    <div class="maintenance-contact">
      <div class="maintenance-contact-label">若需協助,請於門診時間來電</div>
      <a class="maintenance-contact-phone" href="tel:073631313">07-363-1313</a>
    </div>

  </div>

  <div class="maintenance-footer">
    <div class="clinic">悅心診所</div>
    <div>YUEXIN CLINIC</div>
  </div>

</div>

</body>
</html>
